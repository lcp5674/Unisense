# Unisense 模块交付状态追踪（单一事实源）
# 维护规则：
#   1. 每个模块一行；agent 每完成一个可验证步骤必须更新对应字段，状态只能前进，回退须写 rollback_reason。
#   2. status 取值：planned | dev | implemented | verified | released | blocked
#      - implemented : 代码写完 + 单元测试通过（pytest exit 0，附 evidence 路径）
#      - verified    : implemented + 集成/契约/安全反向/混沌/性能基线 全部门禁绿（gateways.yml 定义）
#      - released    : verified + runbook 存在 + migration 可逆验证通过
#                      + 交付后双视角漏洞审查通过（DEV_GUIDE §6.3, 2026-08-07 新增约束）
#      - 双视角审查：独立方在 verified 之后、released 之前执行「产品视角+技术视角」漏洞审查，
#        结论写入 docs/CHANGELOG_MODULES.md；0 个 High 漏洞方可 released（Medium/Low 须有处置计划）。
#   3. evidence_path 必填（测试报告/截图/日志），禁止空口声明"已完成"；文件须真实存在、非空、≥50字节。
#   4. verified_at 必填（仅 verified/released）：最后验证通过的 ISO 日期，用于判断是否过期（超 30 天须重验）。
#   5. 本文件由 CI 一致性校验脚本扫描（scripts/contract_check.py），与 TD §3/§4/§18 偏离则失败。
#   6. 每次变更追加变更记录到 docs/CHANGELOG_MODULES.md（审计链，不可改写历史行）。
#   7. CI/.gateways.yml 标记 protected，其门槛禁止开发 agent 自改以绕过验证。

