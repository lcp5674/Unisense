    note_20260827_n: "主题域参照数据医疗化（2026-08-27，dimension+glossary+semantic）：用户需求「从医疗行业出发完善维度管理里的维度，清除 mock 数据」+「从微医企业实际业务场景出发，覆盖并丰富维度、术语、主题域等参照数据」。新增幂等 seed 脚本 `backend/scripts/seed_medical_reference.py`：① 主题域——保留既有 7 医疗域 + uncategorized（seed_domains_dicts 创建），新增 4 个微医线上业务一级域（online_consultation 在线问诊/internet_hospital 互联网医院/appointment 预约挂号/health_management 健康管理）并为全部一级域补 30 个二级子域（挂号/就诊/分诊导诊/处方/药品分类/药房/收费项目/费用结算/退费/险种/医保结算/病种/诊断编码/病历质控/不良事件/质量基准/患者档案/健康档案/图文问诊/电话问诊/视频问诊/在线复诊/电子处方/药品配送/号源/预约/候诊队列/体检/慢病管理/家庭医生），树形 2 层 42 节点；② 维度 12 个 + 96 成员（详见 dimension note3）；③ 术语 24 条（详见 glossary note5）。真实 DB 执行成功（清 8 维度+8 术语、灌 34 域节点+24 术语+12 维度+96 成员、孤儿引用归零、幂等重跑 0 新增）；后端 dimension/glossary/subject_domain 相关 232 passed；前端 Glossary+Dimensions 62 passed + tsc 0。影响接口：无（纯参照数据 seed + 前端占位文案）。"
    note_20260827_o: "参照数据按六大业务主线重构（2026-08-27，dimension+glossary+semantic）：用户反馈「应该从医疗、医药、医保、挂号、健康管理、健共体这些实际业务出发进行设计参照数据」。在医疗化（note_20260827_n）基础上重构 seed_medical_reference.py 为六大业务主线：① 主题域——新增健共体一级域 health_community（微医数字健共体核心）+ 7 二级子域（medical_alliance 医联体 / medical_community 医共体 / referral 双向转诊 / remote_consult 远程会诊 / family_doctor_sign 家医签约 / shared_resource 资源共享 / public_health 公共卫生）；各业务线补缺失子域——医疗（exam_lab 检查检验 / surgery 手术）、医药（drug_inventory 药品库存 / drug_procurement 药品采购）、医保（yb_directory 医保目录 / commercial_insurance 商业保险）、挂号（sign_in 签到取号）、健康管理（health_education 健康教育 / vaccination 疫苗接种），二级子域 30→47；② 术语 +15 至 39 条（健共体协作 9：双向转诊/上转/下转/医联体/医共体/远程会诊/家医签约/检查检验互认/慢病随访；补充 6：药品比价/商保理赔/体检/疫苗接种/健康教育/签到取号）；③ 维度 +6 至 18 个（健共体 3：health_community_referral_type 转诊类型 / health_community_alliance_type 医联体类型 / health_community_sign_status 家医签约状态；补充 3：checkup_project 体检项目 12 项 / medication_drug_form 药品剂型 8 种 / register_shift 出诊时段），成员 96→134。验证：真实 DB 执行成功（新增 17 域节点 + 15 术语 + 6 维度，幂等重跑 0 新增）；六大业务主线全部齐备（医疗 outpatient/online_consultation/internet_hospital/diagnosis、医药 medication、医保 medical_insurance、挂号 appointment、健康管理 health_management、健共体 health_community）。影响接口：无（纯参照数据 seed 扩展）。"
    note_20260827_p: "参照数据补强医生层面 + 业务缺口（2026-08-27，dimension+glossary+semantic）：用户反馈「为什么缺少医生层面的」+「确定按照这个清单补强，另外再次审查看还缺少哪些内容」。在六大业务主线（note_20260827_o）基础上升级为七大主线（+医生管理）：① 主题域 +10 至 69 节点——新增「医生管理」一级域 doctor_management 及 5 二级子域（doctor_qualification 医生资质 / doctor_schedule 医生排班 / doctor_performance 医生绩效 / multi_site_practice 多点执业 / doctor_team 医生团队）；业务缺口子域——prescription_flow 处方流转（medication）/ drg_dip 支付方式改革（medical_insurance）/ corporate_health 企业健康（health_management）/ family_bed 家庭病床（health_community）；② 术语 +22 至 61 条——医生层面 13 条（licensed_doctor 执业医师 / doctor_title 医师职称 / chief_physician 主任医师 / associate_chief_physician 副主任医师 / attending_physician 主治医师 / resident_physician 住院医师 / multi_site_practice 多点执业 / primary_practice_org 主执业点 / doctor_schedule 医生排班 / expert_clinic 专家门诊 / attending_doctor 责任医生 / doctor_team 医生团队 / doctor_service_duration 医生服务时长）+ 业务缺口 9 条（prescription_flow 处方流转 / drug_traceability 药品追溯 / drg DRG付费 / dip DIP付费 / outpatient_pooling 门诊统筹 / cancel_register 退号 / no_show 爽约 / corporate_health 企业健康管理 / family_bed 家庭病床）；③ 维度 +5 至 23 个 + 医生维度扩充——新增 doctor_title 医生职称（SCD0，5 级）/ medical_org 医疗机构（SCD1，三级/二级/一级/社区/乡镇/村卫生室/互联网医院，健共体分级诊疗分析地基）/ patient_source_channel 患者来源渠道（SCD0，APP/小程序/公众号/H5/线下扫码/转介绍）/ visit_status 就诊状态（SCD0，待就诊/候诊/就诊中/已完成/取消/爽约）/ payment_method 支付方式（SCD0，微信/支付宝/银联/医保个账/商保直付）；outpatient_doctor 医生维度成员 8→16（覆盖 14 科室，attributes 补 practice_type/doctor_level/is_expert）；④ seed_dimensions 幂等增强——维度已存在但成员集合与脚本不一致时自动刷新（删旧重灌），参照数据与脚本同步（不再「已存在即跳过」导致扩充成员不生效）。验证：真实 DB 执行成功（新增 10 域节点 + 22 术语 + 5 维度 + 医生维度 8→16 成员刷新，幂等重跑 0 新增）；落库复核——主题域 69 节点（14 一级）/ 术语 61 / 维度 23，医生维度成员 attributes 五字段齐全。影响接口：无（纯参照数据 seed 扩展）。详见 CHANGELOG_MODULES 2026-08-27 条目。"
    note_20260827_q: "参照数据补齐八大缺失业务线（2026-08-27，dimension+glossary+semantic）：用户反馈「你认为主题域是否涵盖了企业所有业务」+「按照这个清单进行补齐」。审查发现主题域覆盖度约 60-70%、缺 8 条业务线后系统补齐：① 主题域 +45 至 114 节点（22 一级域）——新增 8 个一级域（insurance 保险：保单/核保/理赔/商保直付/保险经纪；membership 会员权益：家庭会员/健康权益/会员权益/会员渠道；health_ai 医疗AI与数据：智能导诊/AI辅诊/医疗大模型/健康大数据/智能报告；clinical_research 临床科研：真实世界研究/临床试验/科研协作/科研数据；supply_chain 医药供应链：药械集采/SPD院内物流/器械耗材/DTP药房；care_elderly 康复护理养老：居家护理/康复/长期护理保险/养老服务；specialty_center 专科运营：肿瘤中心/妇儿中心/心理精神/口腔中心/中医中心/慢病专病；patient_service 患者服务运营：患者教育/随访服务/满意度/投诉服务/患者关怀），补齐微医平台商业化与增量业务线；② 术语 +37 至 98 条（保险 5：保险经纪/保单/核保/惠民保/免赔额；会员 4：家庭会员/健康权益/会员等级/微医通；AI 5：智能导诊/AI辅助诊断/医疗大模型/健康大数据/智能报告；科研 5：真实世界研究/临床试验/科研协作/知情同意/科研数据；供应链 4：药械集采/SPD院内物流/器械耗材/DTP药房；养老 4：居家护理/康复治疗/长期护理保险/养老服务；专科 5：肿瘤中心/妇儿中心/心理门诊/专病管理/中医中心；患者服务 5：患者随访/患者满意度/净推荐值NPS/患者教育/投诉处理）；③ 维度 +6 至 29 个（insurance_product_type 保险产品类型 / member_level 会员等级 / specialty_center_type 专科中心 / care_service_type 照护类型 / ai_scene AI应用场景 / research_type 科研类型）。验证：真实 DB 执行成功（新增 45 域节点 + 37 术语 + 6 维度，幂等重跑 0 新增）；落库复核——主题域 114 节点（22 一级域）/ 术语 98 / 维度 29，覆盖医疗供给侧流程 + 平台商业化/增量业务 + 患者运营侧全业务版图。影响接口：无（纯参照数据 seed 扩展）。详见 CHANGELOG_MODULES 2026-08-27 条目。"
    note_20260827_r: "SQL 智能推断三连修——关联维度回填 + LLM 名称 JSON 净化 + 使用表语义澄清（2026-08-27，semantic+frontend）：用户反馈「没有把关联的维度也回填、回填的名称为什么是 json、使用表不准给出 Select 文本，怎么会知道有哪些消费指标的客户表」。① 关联维度回填——后端 `sql_infer.extract_dimension_columns` 从 GROUP BY 提取非时间键（宽松过滤时间 hint/粒度别名/时间函数包裹，业务维度列保留）；`parse_sql_profile` INSERT 下沉场景（INSERT...SELECT 包裹，顶层 select 常是无 GROUP BY 的透传投影）顶层无分组时从含聚合子查询补提 group_by/time_column——此前恒空致下沉 SQL 的维度/时间列无法提取；批量候选 `_build_atomic_candidate` 新增 `dimensions` 字段、单条 auto-suggest 返回 `dimensions`；前端候选卡片「关联维度」多选预填可编辑（去掉 maxTagCount=responsive 保证预填可见）+ 主表单 auto-suggest 回填 + 向导回填 + 批量/单条提交合入 definition_json.dimensions（血缘据此生成指标↔维度边）。② LLM 名称 JSON 净化——`parse.py` 新增 `clean_llm_text_field`（字符串形如 JSON 对象 `{` 开头时二次 json.loads 提取 name/metric_name/title/value；普通文本/数字/非法 JSON 原样返回，刻意宽松不误伤），接入 `extract_str_field`（统一净化）+ `_llm_metric_name` + `_suggest_metric_llm_overrides` + `_apply_candidate_annotations` 四处——此前 LLM 在「只返回名称本身」指令下仍把答案包成 `{metric_name: 月活}`，解析层只 strip 引号导致名称原样显示成 json 文本。③ 使用表语义澄清——直接回应「怎么会知道有哪些消费指标的客户表」：SQL 推断在物理上不可能知道指标下游（一条 INSERT...SELECT 只含上游加工逻辑），单条 auto-suggest 回填的「使用表（下游）」是表级血缘下游（源表被哪些表消费，来自血缘图），主表单 extra 与血缘推断区块澄清「非指标被消费的客户表；指标级下游在指标创建、被下游 SQL 引用后由血缘自动补，此处可留空」。验证：后端 test_llm_parse +6 + test_sql_infer +5 + test_sql_split +1（下沉候选携带 dimensions 集成，真实医生 SQL 实测 dims=['hosp_code','enter_source']）相关 270 passed + ruff 0（仅 HEAD 既存 parse.py E501）；前端 MetricCreate 90（+1 关联维度预填）+ 前端全量 1079 全绿 + tsc 0。影响接口：无（批量候选与 auto-suggest 响应新增 `dimensions` 字段，向后兼容）。"
    note_20260827_k: "指标详情页挂载实体卡片化展示（2026-08-27，semantic+frontend）：用户反馈「指标详情页里展示的挂载实体展示有些紧凑，布局样式也不美观，无法让用户很直观感受到挂载实体的具体信息」。挂载实体从「单行 flex 文本堆叠」（表名 Tag + 一段 `列：x · 粒度：y · 默认周期：z · 域：w · 业务限定：…` 挤在一起 + 责任方 Tag + 解除按钮）改为卡片式 Descriptions 网格——每个挂载实体一张浅灰底圆角卡片：卡片头（数据库图标 + 等宽粗体物理表名 + 「业务限定」橙色 Tag + 右上角解除挂载按钮，按钮不随字段换行）、字段区（Descriptions column=2：源列/粒度/默认周期/业务域/业务限定/责任方，标签与值分离、空值「—」/「继承指标级」占位、责任方按角色着色 Tag——产品蓝/技术紫/数仓青）；多变体各占一卡，一眼可辨每变体的物理表与口径要素。验证：前端 MetricDetail 84（2 项挂载展示测试改为卡片内 within(mount-card-*) 精确断言：表名/源列/粒度/默认周期/业务域/业务限定/责任方逐项 + 双卡双解除按钮）+ tsc 0。影响接口：无（纯前端展示布局）。"
    note_20260827_j: "SQL 智能推断抽屉可拖宽 + 批量解析候选卡片化布局（2026-08-27，semantic+frontend）：用户反馈「批量解析结果展示布局有些紧凑，用户阅读不够直观，需要优化布局；另外 SQL 智能推断侧边栏也要支持左右移动」。① 抽屉可拖宽——SQL 智能推断抽屉由固定宽度（单条 540/批量 760）Drawer 换为 `ResizableDrawer`（复用全站详情抽屉自研组件）：左缘 6px 拖拽手柄左右拖动调整宽度（clamp 520–1200），`storageKey=unisense.drawer.sql-infer.width` 持久化到 localStorage（对齐全站左侧侧边栏/详情抽屉拖拽交互）；② 批量结果卡片化——每个候选从「13+ 控件单行 flex 换行拥挤布局」改为「卡片三区」：头部行（勾选 + 类型 + 名称 + AI推断/口径需核对/建议域/需先发布依赖原子/派生周期驱动徽标 + 在向导中编辑）、字段区（原子 = 聚合/单位/周期/粒度/关联逻辑度量/产品负责，派生/复合 = 依赖指标/计算表达式/派生口径；每字段「11px 小标签置顶 + 控件」纵向排列，一眼可辨）、底部行（指标编码 + 口径表达式 Tooltip）；Collapse 可视高度 360→480；全部 data-testid 保留（含 req-deps/req-expr 必填星号迁至字段 label 旁）。验证：前端 MetricCreate 85（+1：抽屉拖拽手柄存在 + 候选字段标签 聚合/关联逻辑度量/指标编码 展示）+ tsc 0。影响接口：无（纯前端布局与交互）。"
    note_20260827_e: "MetricResponse.rejected_at 类型 str→datetime 修复（2026-08-27，semantic）：用户反馈「指标目录列表接口 500」——后端日志 1 validation error for MetricResponse: rejected_at Input should be a valid string（input datetime）。根因：schema `rejected_at: str` 自 8-17 引入（ebdac29f4）即与 service reject 落库 `datetime.now(UTC)` 类型不匹配，一直潜伏，直到 08-27 02:45 出现第一条真实被驳回记录才在列表接口（含被驳回记录）model_validate 炸 500；`approved_at`/`description_updated_at`/`deprecated_at`/`sunset_until` 均已 datetime/date，仅此字段漏网。修复：`MetricResponse.rejected_at` 改为 `datetime | None`（pydantic 序列化 datetime 输出 ISO 字符串，前端 formatCnTime 直接兼容）+ 补回归测试（含驳回记录列表、reject 后读取 rejected_at 为 ISO 字符串）；真实 DB 36 条 Metric（含驳回记录 id=35）全部 model_validate 通过。验证：test_metric_catalog_enhance 7 项相关全过 + ruff 0；容器重建（git archive HEAD 干净快照隔离并行会话 WIP）后端到端实测接口不再 500。影响接口：无（序列化输出格式不变）。"
    note_20260815: "血缘图谱支持全通道表级血缘 + 来源通道筛选：新增 GET /lineage/graph provenance 参数（dp_csv/sqlglot/metric_definition/all/空），指定通道时经 repo.graph_from_edges 从 lineage_edge 直接构建表级血缘（节点=边两端 table/metric/field 去重 + resolve_node_meta 富集），不再受采集目录交集限制；前端血缘图谱 Tab 新增来源通道筛选（默认全部血缘），血缘图谱默认展示完整表级血缘。修复：血缘图谱看不到 DP 血缘（db_catalog 与血缘边表交集仅 4 张）。"
