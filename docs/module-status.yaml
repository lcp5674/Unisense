    note_20260828_s: "指标回收站批量彻底删除 + 列表删除可发现性（2026-08-28，semantic+frontend）：新增 POST /metric-definitions/batch-purge（仅平台管理员，逐条复用 purge_metric 级联清理 + 审计 + 容错，已软删记录才可硬删）；前端回收站视图开放「批量彻底删除」菜单项 + 红色确认弹窗 + 失败明细，列表页 REVIEW/EXPERIMENTAL/PUBLISHED 行删除位提示「需先打回/下架后在草稿态删除」。验证：后端 test_metric_batch_api 22（+3）+ 相关 341 passed + ruff 0；前端 MetricCatalog 60（+1）+ tsc 0。影响接口：新增 POST /metric-definitions/batch-purge（向后兼容）。"
    note_20260828_v: "创建指标 422 根因修复（2026-08-28，frontend+semantic）：用户报 POST /metric-definitions 422。根因——后端 MetricCreateRequest.metric_code 对显式值严格校验 4 段式（域_业务对象_度量_统计周期），前端注册向导/批量候选/模板实例化均无格式预校验；更严重的是模板实例化把模板 code（3 段标识如 tpl_gmv_daily）错误预填为指标编码，后端 MetricCreateRequest(**merged) 校验 422「当前仅 3 段」。修复——新建 frontend/src/utils/metricCode.ts 共享校验 validateMetricCode（与后端 ConflictPrechecker.validate_code_format 同规则：split 数段==4 + 每段 ^[a-z][a-z0-9_]*$，不依赖整串正则避免段间下划线歧义），接入注册向导 Form.Item rules、批量候选输入框红框提示、Templates rules；批量创建提交前逐候选预校验；模板实例化 openInstantiate 仅当模板 code 合法 4 段才预填、否则留空自动生成；SQL 模式加超长预检（>16384 拦截对齐 T11）。验证：前端 metricCode 单测 5（新）+ Templates/MetricCreate 110 passed + tsc 0。影响接口：无（纯前端校验/预填修正）。"
    note_20260828_t: "API 文档（Swagger/ReDoc）本地化 + CSP 修正 + openapi.json 生成 bug 修复（2026-08-28，infra+semantic+frontend）：用户反馈 localhost:8180/docs 看不到 Swagger UI。根因——后端 SecurityHeadersMiddleware 给所有响应（含 /docs）打严格 CSP default-src 'self'，而 FastAPI 默认 Swagger UI 从 jsdelivr CDN 加载资源且有 inline script 被拦截；nginx 反代 docs 叠加宽松 CSP 与后端严格 CSP 形成双头交集=严格仍拦截；另发现 consume.py 的 request: Request 依赖参数未导入 Request（from __future__ import annotations 下变未解析 ForwardRef 被当 body 参数）→ /openapi.json 生成 500。修复——① swagger-ui-dist@5.18.2 / redoc@2.2.0 下载到 backend/static/（离线可用），main.py 挂载 /static + 自定义 _swagger_ui_html（配置经 meta swagger-config 注入、swagger-init.js 外置读取，消除 inline script）→ docs CSP 收紧到 script-src 'self'；② middleware.py 对 /docs /redoc 返回本地化精确 CSP，API 响应保持严格 default-src 'self'；③ nginx docs 反代隐藏后端 CSP 头并显式设置相同本地化 CSP（杜绝双头交集混乱）+ 新增 location ^~ /static/ 反代（^~ 优先于正则静态资源 location，避免 .js 被 SPA 回退 index.html 404）；④ consume.py fastapi import 补 Request。验证——后端 test_docs_localized（新 5 项）+ test_middleware 25（+2 docs/redoc CSP）+ consume 96 + ruff 0；真实容器 8100 与 8180 双入口 /docs 200、静态资源 200、单一本地化 CSP 头、页面 0 CDN 引用；app.openapi() 生成成功（371 路径，此前 500）。影响接口：无（docs/redoc 静态资源由 CDN 改同源 /static/，openapi.json 从 500 修复为可生成，API 契约零变化）。"
    note_20260828_u: "API 文档禁止缓存（2026-08-28，infra）：/openapi.json 是 FastAPI 运行时根据当前注册路由动态生成的接口清单，响应无 Cache-Control 头会被浏览器启发式缓存，接口变更后刷新 docs 可能拿到过期定义（文档不同步）。SecurityHeadersMiddleware 新增 _DOCS_CACHE_PATHS=(/docs,/redoc,/openapi.json)，命中路径统一 Cache-Control: no-store（docs 页面/接口清单每次访问拉取最新；普通 API 响应不受影响）。验证：test_middleware 22（+2）+ test_docs_localized 5 全过 + ruff 0；真实容器 8100/8180 双入口 /openapi.json 200 + no-store、/docs 0 CDN 引用 + 单一本地化 CSP。影响接口：无（仅响应头增强）。"
    note_20260828_w: "指标目录「下游引用」筛选（2026-08-28，semantic+frontend）：用户『增加有无下游引用的筛选过滤，方便批量废弃时直接操作』。① 后端——list_metrics 新增 has_downstream 过滤（MetricListParams 加字段 + repository EXISTS 子查询：活跃血缘边 source_node=concat('metric:', code) 且 edge_type∈(DERIVED_FROM,CONSUMED_BY) 且 deleted_at IS NULL/stale=False，语义与 downstream-check 一致；true 仅有下游 / false 仅无下游 / 缺省不过滤）+ service 透传；② 前端——指标目录条件筛选行新增「下游引用」下拉（全部/有下游/无下游），load 透传 has_downstream、useEffect 依赖联动、handleResetFilters 重置、已应用筛选回显 Tag 可一键清除、hasFilter 纳入判定。验证：后端 test_semantic_repository 10（+1 has_downstream 三态）+ semantic 364 passed + ruff 0；前端 MetricCatalog 61（+1 有/无下游透传 + Tag 清除回默认）+ tsc 0。影响接口：GET /metric-definitions 新增可选 has_downstream（向后兼容）。"
    note_20260828_y: "OpenAPI Schemas 区域中文化（2026-08-28，infra，用户『Schemas 为什么也是全英文的』）：上一轮 OpenAPI 中文化只覆盖 tag/summary/info，未触及 components.schemas（Swagger UI 5.x 用 schema.title 渲染模型标题，pydantic 自动生成英文类名作为 title，故 Schemas 列表仍是 MetricResponse/ApiResponse[XXX] 等英文）。修复——openapi_localize.py 新增三块：① SCHEMA_ZH 覆盖 200+ 核心业务 schema（指标/维度/术语/度量/挂载/血缘/治理/采集/通知/AI/订阅/治理/认证）title 中文化（MetricResponse→指标详情响应、MetricCreateRequest→新建指标请求、DimensionResponse→维度响应、ConflictStatus→冲突状态 等）；② ApiResponse 类 title→统一响应信封，79 个 ApiResponse[X] 模板实例→统一响应信封[X的中文名]（同步翻译嵌套内部类型）；③ FIELD_TITLE_ZH 80+ 高频字段 title 中文化（code→业务码/message→提示信息/data→业务数据/trace_id→链路追踪 ID/id/status/type/created_at/updated_at/granularity/aggregation/domain/source_table/source_column/metric_code/owner_id/page/page_size/total 等）；**关键约束**：仅修改 schema/字段 title，**字段名（properties key）与 description 完全不动**→ API 契约零变化；未命中映射的 schema/字段保留 Pydantic 默认英文 title（不破坏契约，新接口不需改映射即可展示）；幂等——二次 localize 不会清空已有中文 description。验证：test_openapi_localize 14（+8：ApiResponse 类 title/79 模板 title/SCHEMA_ZH 命中/未映射保留英文/字段 title 不覆盖 description/字段 key 不变/二次 idempotent/未映射字段保留）+ ruff 0；真实容器 Playwright 截图——8180/docs 展开 Schemas：接入方状态、统一响应信封、统一响应信封[Any]、统一响应信封[批量推断历史项]、统一响应信封[采集目录响应] 等中文标题；展开统一响应信封字段：code→业务码/Default OK、message→提示信息/Default success、data→业务数据、trace_id→链路追踪 ID。影响接口：无（仅 OpenAPI 展示层中文化，API 契约零变化）。"
    note_20260828_x: "OpenAPI 文档中文化 + Swagger UI 品牌化美化（2026-08-28，infra，用户『接口页面太丑且缺少中文描述』）:① OpenAPI 展示层中文化——新建 backend/app/openapi_localize.py 集中映射（不侵入 30+ 路由文件，无并行冲突）:33 个业务分组名中文化（tag.name 直接中文化兼容 Swagger UI 5.x——其渲染分组标题用 name 而非 x-displayName）+ 分组描述;operation.tags 引用同步替换;281 个唯一英文 summary 翻译为中文（List/Create/Get/Update/Delete/Publish/Submit/Approve/Reject/Deprecate/Batch/Infer/Validate 等）;info.title/description 中文化;幂等设计（已本地化不重写 description）。② Swagger UI 品牌化美化——新建 backend/static/swagger-ui/custom.css 自主品牌主题:深蓝渐变顶栏 + 中文系统字体栈 + 圆角卡片式分组 + 5 档方法徽章配色 + 响应式。③ swagger-init.js 显式 config.layout=StandaloneLayout 启用顶栏（preset 仅注册组件不显式指定 layout 仍 BaseLayout 无顶栏）。验证: test_openapi_localize 5 + test_docs_localized 6 + ruff 0;真实容器 8100/8180 双入口 openapi.json 中文 + /docs 品牌顶栏 33 中文分组。影响接口:无（仅展示层）。"
    note_20260828_z: "资产地图 Owner 视图责任人下拉显示真实姓名（2026-08-28，frontend，用户『筛选框为什么展示『责任人#3』』）：OwnerTab 从图谱节点提取 owner 后下拉 label 原用模板串 `责任人 #${id}`，未用 listUsers 解析真实姓名。修复——并行加载 listUsers 构建 userMap（display_name 优先回退 username），下拉选项/视图名/drillTitle 均用 userMap[id] 解析真实姓名，仅用户表查不到该 id 才降级「责任人 #id」；拉取失败静默降级不阻塞视图；空态行为不变（不伪造用户）。验证：tsc 0；AssetMap 61 passed（+1 下拉显示真实姓名「管理员」而非「责任人 #1」）。影响接口：无（纯前端展示层）。"

