    note_20260825: "指标口径完整三层展示 + 业务口径录入闭环（2026-08-26，纯前端）：用户反馈「详情页没把技术口径、数仓SQL口径展示出来，只在口径定义里展示了口径 SQL」——核实产品文档 §2.2 三层口径（业务口径=口径定义 / 技术口径=源业务库口径 SQL / 数仓SQL口径=数仓落地口径）此前展示层标签语义不对齐（「口径 SQL」笼统）、业务口径维度在 MetricDetail DefinitionCard 完全未渲染、数据层 27 指标 0 个填业务口径（22 有 sql、1 有 dw_definition）。修复：① 展示层——display.tsx `DEF_FIELD_LABEL` 新增 `definition→业务口径`、`sql/etl_sql→技术口径（源业务库口径）`、`dw_definition→数仓SQL口径`（DEF_CANON_ORDER 补 definition 至首位，AssetMap 对比/通用渲染全局跟随）；MetricDetail DefinitionCard / MetricCatalog 展开区 / 资产地图 MetricDetailDrawer / MetricReview 评审弹窗四处统一三层标签；业务口径、数仓SQL口径为空时显示「未填写（可在编辑弹窗补填）」灰色占位而非隐藏（此前空字段条件渲染隐藏致「没展示」错觉）；② 录入层——注册向导 MetricCreate Step② 与编辑弹窗 MetricDetail 新增独立「业务口径」输入框 → definition_json.definition（编辑弹窗 dirty 语义：改过合入/清空移除），SQL 与表达式模式均合入，三层口径录入闭环。验证：MetricDetail 76（+2 三层展示+空态/业务口径回填修改清空）、MetricCreate 53（+1 业务口径输入区+三层提交断言）、MetricCatalog 56（改标签断言）、MetricReview 20、AssetMap 59 全绿 + tsc 0。无接口变更（definition_json.definition 为既有字段）。"
