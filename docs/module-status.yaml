    note9: "变更追踪行点击侧边栏详情(2026-08-15 403d167)：用户反馈变更追踪点击行应在本页侧边栏展示具体信息。① 目录行 → 实体详情抽屉（fetchAssetEntityDetail 按 id 拉取：实体/数据源/敏感度/责任人/字段数/表级描述/Schema 状态/源健康/新鲜度 + 字段清单 renderSchemaSummary + 血缘边明细 + 关联指标），抽屉 footer「在采集目录中查看」跳 /catalog?kw=；② 指标行 → 指标详情抽屉（getMetric + listSnapshots：业务描述/口径 Descriptions/口径明细 DefinitionsDetail/数值快照），不再整行直接跳转指标详情页（编码列链接保留跳转）；③ 漂移行 → Schema 漂移抽屉（diff_json 结构化解构：变更键值 Descriptions + before/after 左右对照 pre）。三个抽屉均用模块级组件（ChangeCatalogDetailDrawer/ChangeMetricDetailDrawer/ChangeDriftDetailDrawer）+ ResizableDrawer 拖拽调宽 + 宽度持久化。测试：前端 AssetMap 46（新增目录/指标/漂移行点击开抽屉 3 项）+ 全量 453 全绿 + tsc 0。"
    note10: "变更追踪返回机制审计修复(2026-08-15 36e42b3/b387252)：用户反馈「在采集目录中查看」跳错页面且返回无来源感知。① 根因：抽屉跳转写成 /catalog（指标目录）应为 /catalogs（采集目录）；且 AssetMap 内部 Tabs 是组件 state，history.back() 返回 /assetmap 会重新挂载重置到默认 graph tab。② 修复：目录抽屉/图谱表节点引导跳转改 /catalogs?kw=&focus=&from=（来源+定位参数）；采集目录 Catalogs 消费 ?from=变更追踪/资产地图 显示来源返回按钮并精确跳 /assetmap?tab=changes 或 /assetmap、?focus= 高亮目标行（3s 清除）；AssetMap 支持 ?tab= URL 初始化 Tab；变更追踪指标跳转带 state.from=assetmap-changes，MetricDetail 据此精确返回 /assetmap?tab=changes（指标详情页返回机制原本已来源感知，OK 未改）。③ 审计结论：指标详情跳转返回机制 OK（MetricDetail 已有 dashboard/todo 来源感知+history 兜底）；仅目录跳转两处存在路径错误+无来源感知，本次全部修复。测试：AssetMap 47（新增目录抽屉跳 /catalogs+from/focus 断言）+ Catalogs 18（新增来源返回/高亮 2 项）+ 全量 464 全绿 + tsc 0。注：b387252 含并行会话在途的字段详情抽屉表级信息重构+单表采集刷新+描述缺失统计卡（功能完整、测试通过）。"
    note11: "血缘度径向布局+力导向大图降采样(2026-08-15 0db0a70)：用户诉求资产地图力导向布局在边/节点多时展示混乱。① AssetGraph 新增 layout=radial 血缘度径向布局——G6 concentric 同心圆 + sortBy:degree（按依赖引用数排序，枢纽居中叶子外围，环间等距+preventOverlap 防重叠），解决力导向大图节点重叠/边交叉看不清引用关系；布局下拉新增「血缘度径向」项。② 力导向大图边降采样——force 布局边数超阈值(600)时按两端血缘度和降序保留枢纽边，叶子低价值边折叠（悬停邻域高亮仍可显现），缓解边交叉成网。测试：AssetGraph 18 全绿（新增 radial 配置+大图降采样 2 项）+ tsc 0。"
    note12: "节点依赖引用数角标+血缘度筛选(2026-08-15 5153174)：用户诉求资产地图/血缘图谱每个节点显示依赖引用数便于查看与筛选。AssetGraph 增强：① 节点右上角 badge 角标显示血缘度数字（依赖引用数），高血缘度≥5 橙/中≥2 蓝/低灰蓝着色，一眼识别枢纽节点；② 悬停节点 tooltip 显示「依赖 N 项（上游）/被 M 项引用（下游）/血缘度 N」明细（按边方向拆 inDegree/outDegree）；③ 工具栏新增「依赖≥N」筛选下拉（0/1/2/3/5/10），过滤低价值叶子聚焦枢纽；④ 图例补充「右上角数字=依赖引用数」说明。性能保护：badge 纳入 compact LOD 隐藏（badgeOpacity:0），大图缩放不增额外绘制开销。验证：AssetGraph 19 项全绿（新增血缘度筛选用例）+ tsc 0；部署 JS 实测 2110 节点缩放 0 Violation。"
