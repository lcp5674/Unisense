    note_20260815: "血缘图谱支持全通道表级血缘 + 来源通道筛选：新增 GET /lineage/graph provenance 参数（dp_csv/sqlglot/metric_definition/all/空），指定通道时经 repo.graph_from_edges 从 lineage_edge 直接构建表级血缘（节点=边两端 table/metric/field 去重 + resolve_node_meta 富集），不再受采集目录交集限制；前端血缘图谱 Tab 新增来源通道筛选（默认全部血缘），血缘图谱默认展示完整表级血缘。修复：血缘图谱看不到 DP 血缘（db_catalog 与血缘边表交集仅 4 张）。上游依赖图谱层级化（2026-08-15）：纯 SELECT 上游依赖图谱改「本次查询 → 表 → 字段」三层层级——字段挂所属表下（表 → 字段边），字段所属表未出现在 tables 时补建表节点、裸列名（无表前缀）直接挂中心，边方向即血缘 DAG 方向（源上目标下），层次更清晰。验证：前端 LineageView 全绿（新增三层层级/补建表/裸列单测）+ tsc 0。语义泳道 + 图谱全屏（2026-08-15）：AssetGraph 新增语义泳道（lanes）——用隐藏锚点+锚定边把节点按类型聚进三条语义带（表带在上/指标带中/字段带下，与血缘方向一致），表→表加工链在表带内保留纵向分层，开启后有环也强制分层（dagre acyclic 翻转环边+环标记，环不再毁掉全图秩序）；数仓分层徽标（layerBadges，表按 ods_/dwd_/dws_/ads_/dm_ 前缀描边着色、指标按 dw_layer，加工链层级一眼可见）；字段折叠（showFields 控制条可切换）；图谱全屏（fullscreenable，portal fixed overlay 复用同一实例 UI 状态，筛选/搜索/布局不丢失）。血缘图谱/影响分析/SQL 解析/资产地图全部接入 lanes。验证：AssetGraph 16 项全绿（新增泳道 3 + 全屏 1 + 字段折叠 1 + layerOf 1 + applyLanes 1）+ 前端全量全绿 + Hive 子查询别名血缘修复（2026-08-16）：修复 Hive 多表 JOIN + 子查询（如 JOIN (SELECT tag_id, hospital_id FROM wedw_dwd.hospital_tag_df ...) t2 ON t1.hosp_id = t2.hospital_id）血缘解析两处错误——① extract_upstream_deps 字段清单收窄为 SELECT 投影列（经 build_scope + _resolve_projection 递归解析到真实来源表），不再收集 ON/WHERE/GROUP BY 条件列，消除子查询别名（t2.hospital_id）泄漏为伪表/伪字段（前端曾将其拆成 table:t2 节点补建进图谱）；② 前端 upstreamDepsToGraphData 拆分「表.列」改用 lastIndexOf(.)（此前取第一个点会把带库名表 wedw_dw.wy_zh_hospital_std_df.hosp_id 拆成表 wedw 导致字段挂错表）。验证：后端 parser 35 项全绿（新增 Hive 子查询别名不泄漏 1 + 投影穿透子查询 1）+ ruff/format/mypy 0；全数据源方言 CTE 引用泄漏修复（2026-08-16）：排查 MySQL/PostgreSQL/Hive/Spark/Doris/ClickHouse/StarRocks 七种方言的子查询别名（t2）与表名归属，确认子查询别名泄漏已在上述修复消除；新发现 CTE 引用（WITH cte1 AS (...) ... FROM cte1）在所有方言下均被 find_all(exp.Table) 收集为伪源表——表级血缘（INSERT/CTAS 正式血缘）、纯 SELECT 显式落点、上游依赖三条路径全部受影响，正式血缘图会凭空出现 cte1 幽灵表节点。修复：_table_edges/_select_table_edges/extract_upstream_deps 收集源表时排除 _collect_ctes 返回的 CTE 名（tbl.name not in cte_map），CTE 定义内部真实表不受影响。验证：后端 parser 39 项全绿（新增 CTE 引用不泄漏：上游依赖 hive + 七方言参数化 + 表级 INSERT+CTE + SELECT 落点+CTE 4 项）+ lineage 相关 133 项全绿 + ruff/format/mypy 0；前端 LineageView 48 项全绿（新增三层表名 catalog.schema.table 拆分 1）+ 全量 589 全绿 + tsc 0。生产场景语法覆盖核查修复（2026-08-16）：七方言（mysql/postgres/hive/spark/doris/clickhouse/starrocks）生产高频语法矩阵核查，修复 6 类缺口——① INSERT 显式列清单字段映射错位（INSERT INTO t (a,b) SELECT x,y 目标列按位置取列清单 x→a/y→b，此前取投影别名错位为 x→x）；② MySQL REPLACE INTO ... SELECT（sqlglot 不支持降级 Command 全丢，预处理 REPLACE→INSERT 血缘等价）；③ Doris/StarRocks INSERT ... WITH LABEL（sqlglot 解析异常，剥离 LABEL 片段）；④ Hive INSERT OVERWRITE DIRECTORY 目标非表（此前字段级产 src.id→.id 空目标脏边，现返回空且不回退纯查询落点）；⑤ CREATE VIEW/OR REPLACE/MATERIALIZED/TEMPORARY VIEW 血缘（TD§12.2 视图作逻辑表，_find_target/_find_source_query 支持 kind=VIEW）；⑥ 多表 UPDATE 目标判定（UPDATE t1 JOIN t2 SET t2.v=... 目标取 SET 被更新列所属表而非首表）+ extract_upstream_deps 排除写入目标表（INSERT VALUES 不再把 tgt 误收为来源）。验证：parser 49 项全绿（新增 10 项）+ lineage 相关 152 项全绿 + 全量 unit 2383 passed（5 预存失败与基线一致）+ ruff/format/mypy 0。第二轮语法覆盖核查（2026-08-16）：真实环境七方言生产语法扩展矩阵（40+ 场景）再次发现 4 类缺口并修复——① **MERGE 字段级血缘整体失效**（sqlglot 双版本兼容：25.x 的 WHEN 分支存于 ast.expressions、30.x 存于 args[\"whens\"]（Whens 容器），修复按版本择一遍历（whens 缺失回退 expressions），并支持无列清单 INSERT VALUES（this=None 时用值中裸列引用列名近似目标列））。另：本地 venv 此前误装 sqlglot 30.16，已降级对齐生产 25.34.1（requirements pin），全部修复在 25.x 下重新验证通过；② **SELECT INTO 血缘全丢**（PG/SQL Server \"SELECT ... INTO newtbl FROM ...\" 建表式赋值，等价 CTAS；_find_target/_find_source_query 识别 Into.this 为 Table 的目标，排除 MySQL \"SELECT ... INTO @var\" 变量赋值（Table 内部 this 为 Parameter）避免误判/脏边）；③ **UPDATE 字段级血缘整体未实现**（build_scope 不支持 Update，新增 _extract_update_edges 手动解析：PG \"UPDATE tgt SET v = s.v FROM src\"、MySQL \"UPDATE tgt JOIN src ON ... SET tgt.v = src.v\"、\"SET v = (SELECT MAX(x) FROM src)\" 子查询值三类来源；自引用/静态值不产跨表边）；④ **CTAS 带列清单字段映射错位**（CREATE TABLE t (a,b) AS SELECT x,y 目标列按位置取列清单 x→a/y→b，_insert_column_list 由仅 Insert 扩展支持 Create 的 Schema（ColumnDef 取 .name））。验证：parser 58 项全绿（新增 9 项：MERGE 无列清单/SELECT INTO 表级字段级/MySQL @var 排除/UPDATE...FROM/UPDATE JOIN/UPDATE SET 子查询/自更新不产边/SELECT INTO 双方言参数化/CTAS 列清单）+ lineage 相关 157 项全绿 + 全量 unit 2392 passed（5 预存失败与基线一致）+ ruff/format/mypy 0。；第三轮真实环境生产语法扩展矩阵（60 场景）发现并修复 3 类缺口：① UPDATE/MERGE 带 CTE 前缀时 CTE 引用被误判为伪源表（_collect_ctes 双版本兼容——25.x 的 Update/Merge 无 ctes property，补从 With.expressions 取 CTE + _extract_update_edges 排除 CTE 引用并穿透 CTE 定义解析到真实表，如 WITH s AS (...) UPDATE tgt SET v=s.v FROM s → ods_src.v→tgt.v）；② CREATE TABLE ... LIKE 结构复制被误产血缘边（无 SELECT 源不产边）；③ extract_upstream_deps 对非 SELECT 语句（ALTER/DROP/TRUNCATE/DELETE/COPY/USE）误收目标表为上游依赖（仅处理 SELECT/UNION）。验证：parser 61 项全绿（新增 3 项）+ lineage 相关 160 项全绿 + ruff/format/mypy 0。第四轮方言覆盖核查（2026-08-16）：Doris/StarRocks CTAS 物理属性剥离（DISTRIBUTED BY/PROPERTIES/ENGINE——sqlglot 25.x 整体降级 Command 致血缘全丢，剥离后血缘语义不变）+ CTE 名与真实表同名遮蔽修复（_is_cte_ref 无 schema 前缀才算 CTE 引用，JOIN ods.cte1 是真实表不再误排除）+ CTE 链式聚合未限定列穿透（MAX(v) 的 v 避开不含该列的 CTE 引用解析到真实表 ods.b）。验证：parser 64 项全绿（新增 3 项）+ lineage 167 项全绿 + ruff/format/mypy 0。第五轮方言覆盖核查（2026-08-16）：EXCEPT/INTERSECT 集合运算血缘支持（此前 _branch_queries 只认 Union、extract_upstream_deps 把 Except/Intersect 当非查询语句跳过——INSERT 源 EXCEPT/INTERSECT 字段级全空、纯 SELECT EXCEPT 上游依赖为空；新增 _is_query_node 统一判断 Select/SetOperation，_branch_queries 递归展开 this/expression 两分支，7 处 (Select, Union) 判断统一替换）。验证：parser 68 项全绿（新增 4 项）+ lineage 171 项全绿 + ruff/format/mypy 0；第六轮(2026-08-16) 多表 UPDATE 跨 SET 字段级双向血缘：UPDATE t1 JOIN t2 SET t1.v=t2.v, t2.w=t1.x 的字段级每项 SET 独立判定目标表（旧实现全局取首表致 t1→t2 方向丢失）；表级受血缘图 DAG 约束取主目标单方向（互刷不入图谱避免循环 409）；验证 parser 70 项全绿（新增 2 项）+ lineage 173 项全绿 + ruff/format/mypy 0。第七轮方言覆盖核查（2026-08-16）：PG UNNEST 数组展开列血缘修复——UNNEST(a.items) AS u(v) 的 u.v 此前无法解析丢边（UNNEST 是 Scope(Unnest) 而非普通子查询，selects 是 Identifier 非 Alias/Column 匹配不上），现 _resolve_column 支持 Unnest 展开表（展开列来源取 Unnest 表达式的叶子列 a.items：带列别名 u.v→a.items、无列别名 AS u 的 SELECT u 也归属 a.items——Unnest 显式列名声明优先于真实表猜测，消除 ods.a.u 伪边）；另确认 70+ 生产场景覆盖正确（聚合 FILTER/窗口帧/JSON·ARRAY 函数/HAVING/DISTINCT ON/FETCH·OFFSET/多列 IN/EXISTS/分区写入/MERGE 变体/引号·Unicode 列名/非血缘语句不误判/嵌套 UNNEST/LATERAL/GROUP BY 别名·序号/QUALIFY/递归 CTE（字段级合理降级）/CK FINAL·SETTINGS/动态分区/INSERT 列清单反向映射/多语句混合/VALUES 无源/EXPLAIN）；MAX_DEPTH 边界确认（CTE 链≤8 层、子查询嵌套≤6 层字段级正常，超限字段级降级空