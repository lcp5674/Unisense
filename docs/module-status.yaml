    - id: PLAT-1
      title: "_READ_ROLES 死代码致 RBAC 闸门缺失（任意登录可读受限数据）"
      services: [assetmap, recommend, observability, notify]
      fix: "GET 端点补 Depends(require_roles(*_READ_ROLES))（范本 glossary.py:83/dimension.py:127/quality.py:75）+ 越权 403 反例测试；全仓 grep 排查其余服务"
