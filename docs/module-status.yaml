    note_20260827_c: "批量推断历史裁剪修复 MySQL 1235（2026-08-27，用户『采集目录推断字段的时候，为什么全部跳过了』）：POST /catalogs/batch-infer-history 写入历史时「保留最近 N 条」的裁剪，把带 LIMIT 的子查询直接嵌进 NOT IN（id NOT IN (SELECT id ... ORDER BY created_at DESC LIMIT 20)），MySQL 不支持 LIMIT & IN/ALL/ANY/SOME 子查询（错误 1235）→ 批量推断会话结束写历史时 500，前端表现为「推断全部跳过」。修复：新增 _prune_batch_infer_history——先物化「最近 N 条」id 列表再以具体值列表裁剪（彻底绕开子查询 LIMIT）；keep_ids 为空时跳过更新（not_in(空) 会渲染为永真条件导致全表软删）。验证：后端 test_batch_infer_history 6 passed（+2：裁剪 Update 编译 SQL 不含 LIMIT / keep_ids 空时跳过裁剪）+ collector 相关 236 passed + ruff 0。"
    note_20260827_d: "Spark Thrift 无注释占位串致批量推断全跳过修复（2026-08-28，用户『在采集目录的描述缺失治理中，对 wedw_dim.pub_date_manual 表进行字段推断，为什么直接跳过了』）：根因——hive_uncategorized 数据源经 pyhive 直连 Spark Thrift Server，DESCRIBE 对无 COMMENT 列返回占位串 'from deserializer'（Spark StructType 反序列化默认 comment），连接器原样写入 schema_json → 批量推断 infer_descriptions_batch 跳过逻辑把假注释当真实 DDL 注释（影响面 161 表 200 列），而描述缺失面板口径只看 column_descriptions（manual/llm）→「面板显示缺失、推断却全跳过」矛盾。修复三层：① 公共常量 services/collector/placeholders.py（PLACEHOLDER_COMMENTS={'from deserializer'} + is_effective_comment 排除空/纯空白/占位串）；② 连接器治本 connectors/hive.py——DESCRIBE 第三列非有效注释归一化为空串；③ 推断防御 api/collector.py——跳过条件改 is_effective_comment(comment)；④ 数据修复——容器内脚本清已存在 schema_json 占位注释（161 表 200 列，幂等重跑 0 变更），wedw_dim.pub_date_manual（id=23785）28 列恢复可正常推断。验证：后端 test_connectors +1（Spark 占位归一化）+ test_collector_api +1（批量推断占位不跳过）+ collector 全量 356 passed + ruff 0；真实 DB 占位 0 残留。影响接口：无（批量推断行为修复）。"
    note: "工业级修复（2026-08-12）：7种数据源连接器+CollectorRegistry插件注册+Schema Drift检测(内容指纹SHA-256+diff_json+变更历史)+增量采集(混合策略:MySQL/ClickHouse支持增量,其余降级全量)+定时调度(cron+mode)+容错(单表跳过failed_specs+asyncio.timeout(300)+分布式锁+幂等)+健康检查(healthy/unhealthy/unknown+探活端点)+边界处理(空schema告警+connection_config校验+LLM metric+batch事件)——35项缺陷全部修复,达标率从40.5提升至≥88。数据源管理增强（2026-08-13）：新增 PUT /api/v1/data-sources/{source_id} 编辑端点（PATCH语义+审计UPDATE，连接配置变更重新加密+健康重置）；新增 Spark 采集器（connectors/spark.py 继承 HiveCollector 走 Spark Thrift Server/HiveServer2 协议，8 种类型，迁移 0033 扩展 source_type_enum 可逆）；前端业务域改为主题域下拉、类型下拉展示含描述、详情弹窗加编辑入口。Schema 字段描述推断+人工编辑（2026-08-14）：新增 column_descriptions 独立表（迁移 0036，防采集覆盖 manual/llm 编辑）；新增 3 个端点——POST /catalogs/{id}/columns/{col}/infer-description（单字段 LLM 推断）、POST /catalogs/{id}/infer-descriptions（批量推断空 comment 字段）、PUT /catalogs/{id}/columns/{col}/description（人工编辑，source=manual+审计）；LLM 推断复用 build_llm_client+熔断器+降级友好提示；SchemaTable 通用组件（字段名/类型/描述+来源Tag+编辑/推断按钮）；资产地图详情抽屉 Schema 摘要表格化展示（SchemaColumn[] 替代 ObjectView，抽屉 560→720）；采集目录页字段详情抽屉+schema_incomplete 警告+空状态；描述优先级链 manual>llm>schema_json；8 项 LLM 推断单测全绿。工业级深度审查补齐（2026-08-13，提交 2c652d7/22a00a4/f78e3c1/b8ce0a7/7402a1f/eecc7c7）：P0×5——软删数据源撞FK 1451 修复（FOREIGN_KEY_CHECKS=0 包裹+级联清理+原ID复用）、InMemory队列非单例→job查询恒404 修复（get_default_queue单例）、MySQL增量UPDATE_TIME静默漏采（should_mix_in稀疏检测<10%降级全量）、采集循环单实体失败整批回滚（per-spec隔离+失败commit）、Kafka同步阻塞冻结事件循环（asyncio.to_thread）；P1×7——MySQL列类型+注释+默认值采集（PII分类依赖列注释）、Postgres批量列查询消除N+1、ClickHouse连接复用（_ensure_client+close）、Drift日志API暴露（GET /{id}/drift-logs）、废弃表自动对账（仅FULL模式）、幂等键TTL分离、调度与立即采集分离（/schedule只存cron+新增collect-now）；注入守卫\\*/模式误判cron */5 已修；前端数据源详情加变更审计tab；单实体刷新collect_entity（mysql/clickhouse/postgres+POST /entities/{name}/refresh）；集成测试基建修复（8 skip→8 pass：db_env改sync、URL rpartition只换库名、_BACKEND_DIR parents[2]、wipe改DROP/CREATE DATABASE根治1684/1050 flaky、code=='OK'信封、catalog路由对齐）。采集链路体验闭环（2026-08-14，提交 5b9675f/759991a）：采集进度SSE实时推送（GET /data-sources/jobs/{job_id}/stream，worker经progress_cb写JobStore）、采集结果含entities明细（前端详情弹窗「本次采集