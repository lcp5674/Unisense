    note_20260825_b: "指标三层口径 LLM 增强（2026-08-26）：用户要求「编辑弹窗与注册页对业务口径/伪代码口径/数仓口径支持 LLM 能力（丰富增强业务口径、优化数仓口径等）」。新增 `POST /metric-definitions/refine-definition`（field=business/pseudo/dw × action=enrich/generate/optimize + 指标名称/编码/域/技术口径SQL/表达式/各层口径作上下文；`_REFINE_DEPS` 写角色 + current/sql/dw_definition/pseudo_definition 豁免注入扫描；复用 `LlmConfigService.build_client`（DB 配置优先+路由/熔断）+ `strip_code_fence` 解析；LLM 只生成文本回填、不落库不创建版本；不可用/空内容 → `LLM_INFER_UNAVAILABLE`；审计 action `metric_definition.refine`）。前端编辑弹窗（MetricDetail）与注册向导（MetricCreate Step②）三层口径输入框各加 AI 按钮：空值「AI 生成」、业务口径有值「AI 丰富增强」、伪代码/数仓有值「AI 优化」；回填置 dirty（可保存合入/清空移除）。验证：后端 test_metrics_infer_api +4（enrich 成功+上下文入 prompt/禁用 400/空内容 400/非法 field 422）相关 16 全过 + ruff 0；前端 MetricDetail 78（+2）/MetricCreate 58（+1）全过 + tsc 0。"
    note_20260826: "度量目录回收站闭环 + 已删记录不可变加固（2026-08-26，measure_catalog+dimension+glossary+semantic+frontend）：用户反馈「回收站能看到已发布的度量目录」。① 根因——5 条旧电商种子（PUBLISHED）在 08-24 医疗化重置时被软删（当时删除守卫 `8c59053` 未引入），软删只置 deleted_at 不改 status → 回收站显示「已发布」；`_require` 不过滤 deleted_at → 已删记录仍可被 update/publish/submit/approve 复活成矛盾态（系统性缺口，维度/术语/指标同模式）；restore 只允许 DRAFT/DEPRECATED → 卡死记录无操作入口。② A·代码加固——measure_catalog `_require` / dimension `_require` / glossary `_require_term` / metric `get_metric` 统一拒绝 deleted_at 置位记录（getattr 防御式，INVALID_STATE「已删除…请先在回收站恢复或彻底删除」），已删记录除恢复/彻底删除外不可变；③ B·彻底删除闭环——service/repository `purge_measure`（Core delete 物理删除）+ API `POST /measure-catalogs/{code}/purge`（仅 platform_admin，审计 measure_catalog.purge，被指标引用禁止彻底删除）+ 前端回收站「彻底删除」按钮（平台管理员可见，Popconfirm 二次确认）；④ C·存量清理——实测确认 5 条旧电商种子硬删（先清 8 个指标 measure_id 引用：FK fk_metric_measure NO ACTION，含活跃悬空 order_domain_gua_hao_entity_value_day 置 NULL + 7 个已删电商测试指标，再物理删除 5 条）；⑤ 顺带——audit_i18n 补 6 个缺失动词模板（purge/reactivate/refine/cancel_job/list_databases/list_tables）使 verb_coverage 测试转绿。验证：后端 measure_catalog 60（+7：_require 拒绝已删 update/publish/approve + purge 成功/非删/非管理员/被引用）+ 相关 473 全过 + 全量 3664 passed（剩 5 项既存 Redis 状态污染 feature_flags/semantic_cache）+ ruff 0；前端 MeasureCatalogs 14（+1）+ 全量 985 全绿 + tsc 0；真实 DB 清理验证（8 引用清空、5 度量物理删除、回收站剩 6 条可恢复、0 悬空引用）。影响接口：`POST /measure-catalogs/{code}/purge` 新增；已删记录写操作行为收紧为 INVALID_STATE。"
    note_20260826_b: "度量目录改名「原子指标口径库」+ 度量分类字典化（2026-08-26，measure_catalog+frontend）：用户反馈「度量目录对数仓/其他用户不好理解」「度量分类有没有管理入口」。① 改名——前端菜单/搜索类型/页面标题/空态/关联提示全部「度量目录」→「原子指标口径库」（Layout/GlobalSearch/MeasureCatalogs/MetricCreate/MetricDetail/MetricCatalog；API 路径 measure-catalogs 与技术标识不改）；② 度量分类字典化（B1）——迁移 0094 种入 measure_category 字典种子 7 项（幂等）；schema 校验放宽（非空+长度≤32）；service 新增 `_validate_category`（字典未配置→回退枚举、值不在→DICT_VALUE_NOT_FOUND、停用→DICT_VALUE_INACTIVE、DB 异常→放行）；前端分类下拉动态 `listDictItems(\"measure_category\")` + 表格渲染兼容字典新值；SystemDict 字典管理页可在线管理度量分类；③ 排查结论——业务域已由主题域管理、度量格式联动计算逻辑不宜字典化、状态机不字典化、源头系统/默认单位自由文本暂不纳入。验证：后端 measure_catalog 62（+5 字典化测试）相关 79 全过 + ruff 0；迁移 0094 真实 DB 应用验证；前端 MeasureCatalogs 15/SystemDict 21/Metric 三件 237 全过 + tsc 0。影响接口：category 值来源枚举→字典，已配置字典后未知分类被 service 拦截。"
    note_20260826_c: "源头系统字典化 + 同义词编辑弹窗 AI 生成 + 度量格式字典化（2026-08-26，measure_catalog+system_dict+frontend）：用户反馈「源头系统/业务系统术语选项框是空的」「同义词是否加 LLM」「度量格式是否入字典管理」——① 源头系统字典化：迁移 0099 种入 source_system 字典种子 8 项（HIS/EMR/LIS/PACS/医保结算平台/银海his/天信his/事前事中his审核）；前端 source_system Select 动态加载字典候选（保留 mode=tags 自由输入，满足 PRD FR-04-03）；SystemDict 加「源头系统」类型可在线管理；② 同义词编辑弹窗 AI 生成：新增 `POST /measure-catalogs/infer-synonyms`（写角色 + LLM 额度防护，复用 `_suggest_by_llm` 解析 + `is_abnormal_llm_text` 宽松校验，不可用/空内容/垃圾→LLM_INFER_UNAVAILABLE）；前端同义词框「AI 生成同义词」按钮（名称+描述→候选合并去重回填，未填名称提示不调用）；③ 度量格式字典化 + 联动改造：迁移 0099 把 measure_catalog.measure_format 从 MySQL ENUM 改 VARCHAR(32)（允许字典自定义格式写入，对齐 category 先例）+ 种入 measure_format 字典 3 项（AMOUNT/RATIO/NUMERIC，extra JSON 携带默认单位/小数位）；system_dict 加 extra JSON 列（Create/Update/Response 透传）；service 新增 `_validate_format`（字典校验+未配置回退枚举）与 `_resolve_format_defaults`（字典 extra 优先、回退 `_FORMAT_DEFAULTS`），create/update 接入；schema 放宽 measure_format 校验（限长）；前端格式下拉动态加载 + onFormatChange 按字典 extra 联动单位/小数位；SystemDict「度量格式」类型显示默认单位/小数位扩展字段可在线维护。验证：后端 test_measure_catalog 70（+8：格式字典校验/自定义格式 extra 联动/未配置回退枚举/同义词 5）+ system_dict 相关 69 + measure/dict 相关 139 全过 + ruff 0；迁移 0099 真实 DB 应用验证（varchar(32) + extra JSON + 3 格式 + 8 源头系统）；前端 MeasureCatalogs 17（+2）/SystemDict 25（+1）+ 全量 1010（1 项 DataSources 既存 flaky）+ tsc 0；顺带修复 HEAD 既有 AiAssistant.test mock 缺 NL2SQLResult.execute（阻断 tsc/build）。影响接口：`POST /measure-catalogs/infer-synonyms` 新增；system_dict 加 extra 列 + measure_format 列 ENUM→VARCHAR(32)（迁移 0099）；`GET /dicts/measure_format`、`GET /dicts/source_system` 提供候选。"
    note_20260827: "SQL 批量解析质量四连修（A-5 建表注释驱动命名/B 表达式回显/C 派生 UI 澄清/D 路由异常内容 failover）（2026-08-27，semantic+frontend）：用户反馈「批量解析字段名 `uncategorized_doctor_currentmonthactivedoctorcnt_month`、名称『月doctor次数』、依赖指标/计算表达式没填充、解析时间很长」。A-5 建表注释驱动命名——`sql_split._extract_column_comments` 从完整脚本提取建表 DDL 列注释（sqlglot 主路径遍历 ColumnDef 的 CommentColumnConstraint + 正则兜底；修复 Create.this 为 Schema 时表名提取跳过的 bug——标准单引号注释 DDL 主路径现可命中）、`_insert_target_table` 提取 INSERT 目标表（下沉场景列注释定义在目标表而非内层源表，注释反查以目标表为准）、`_build_atomic_candidate` 按 (目标表, code_col) 反查注释注入 measure_meta.comment → `_infer_name`/`_infer_unit` 自动消费（「月活」不再落成「月doctor次数」；`_infer_name` 注释含周期词时不重复加前缀，避免「月月活」）；`auto_fill._CN_COLUMN_LABELS` 扩充医疗词表 25+（doctor/physician/nurse/hosp/org/dept/ward/bed/disease/diagnosis/inpatient/outpatient/operation/medicine/medical_record/appointment 等）作注释缺失兜底。B 表达式回显——批量候选口径表达式 Tooltip 从「仅 atomic」放开：派生（C 分支只读展示）+ 复合（definition_json.sql 完整口径）均创建前可核对。C 派生候选 UI 澄清——derived 候选不再显示误导性「计算表达式输入框（待填）」，改为只读展示解析出的聚合表达式 + Tag「派生（周期驱动，无公式依赖）」，依赖指标保留可选下拉、「需先发布依赖原子」Tag 仅在有依赖时显示（OneData 语义澄清：派生=聚合原语无公式依赖、复合=依赖指标+指标间运算，回应用户「有表达式/依赖不就是复合吗」的疑问）。D 路由 failover 扩展——`LlmRouterClient.chat` 空 content 检查扩展 `is_abnormal_llm_text`（超长流式垃圾/SSE 信封原文也 failover + 计入连续失败冷却），不再把 60k 字符垃圾当成功返回灌进业务字段、不再干等慢实例 29s。验证：后端 test_sql_split 74（+4：Hive DDL 注释提取/正则兜底/INSERT 目标表/完整管线注释驱动「月活」名称）+ test_auto_fill 37（+2 医疗词表）+ test_llm_router_client 12（+2 异常内容 failover+冷却）+ 相关 248 全过 + ruff 0；前端 MetricCreate 68（原「改派生填公式」测试拆为「改派生→只读+依赖+挂载」与「改复合→公式+依赖无挂载」两项）。影响接口：无（纯解析质量/展示/路由韧性增强，候选字段结构不变）。"
    note_20260827_b: "SQL 批量解析提速根治——路由异常内容计入跨请求熔断器（2026-08-27，semantic）：用户反馈「批量解析耗时仍很长，130000ms」。实测定位：用真实 SQL（含 union all 下沉 + 建表注释）在容器内打点——总耗时 48.8s 但仅 1 次 LLM 调用（48.5s），路由尝试序列 [opencode→测试-codebuddy→env]，说明 failover 虽生效但每次调用都先白等测试-codebuddy（host.docker.internal:19090，priority 1）29s 返回流式垃圾才 failover（多语句批量解析多次 LLM 调用叠加 → 130s）。深层根因：路由层 `is_abnormal_llm_text` 判定异常内容后只更新路由实例级 `_consecutive_failures`（每次 build_client 新建 router 即归零、不跨请求），而跨请求持久的每实例熔断器（get_circuit_breaker(\"LLM:{id}\")）只在 LlmClient 抛 httpx/解析异常时 record_failure——垃圾内容被 LlmClient 当成功返回（record_success），熔断器从不累计 → 测试-codebuddy 永不熔断、每次请求都白等 29s。修复（85ff5f66）：`LlmRouterClient.chat` 异常内容分支调用 `self._instances[idx]._breaker.record_failure()`（getattr 防御 + contextlib.suppress best-effort）——垃圾/空内容统一计入跨请求熔断器，连续 5 次后 OPEN，后续请求 LlmClient.chat 在 breaker.allow() 秒级抛错 → 路由立即 failover 到健康实例（不再白等 29s）。验证：test_llm_router_client 15（+3：异常内容 record_breaker_failure / 空内容 record_breaker_failure / 无 breaker 属性容错）+ LLM 套件 104 全过 + ruff 0；容器重建后端到端实测——手动注入 LLM:2 五次失败 state=open 后真实 build_client().chat() 3.3s 返回（测试-codebuddy 被秒级拒绝、路由 failover 到 opencode），修复前同场景需白等 29s。影响接口：无（纯路由韧性增强）。"
    note_20260827_c: "SQL 批量创建结果「快速编辑」抽屉（2026-08-27，semantic+frontend）：用户反馈「批量创建完成后，点击具体的一个指标能在不影响当前页面窗口下快速编辑该指标的相关信息，同时也方便快速切换到其他指标」。实现——批量创建结果表新增「操作」列（仅 DRAFT 可点「快速编辑」），在当前页内打开 Drawer 编辑该指标（不跳详情页、不关闭当前窗口）；字段：指标名称/聚合方式/单位/粒度（非原子）/计算表达式（口径）/数仓详细口径 + 变更原因（必填 ≥4）+ 乐观锁 row_version，保存走既有 PUT /metric-definitions/{code}（updateMetric）；上一条/下一条在批内 DRAFT 候选间循环切换（位置指示 x / y），每次打开/切换重新 getMetric 拉取最新 row_version（他人已改则 409 拒绝）；口径表达式/数仓口径仅 dirty 才合入 definition_json（不碰其他口径键）；handleSqlBatchCreateDone 清空编辑态。验证：前端 MetricCreate 73（+1 快速编辑抽屉打开回填/下一条切换/保存携带 row_version+name+change_reason 断言）+ tsc 0；前端全量 1024 passed（1 项 AssetMap 顺序 flaky 单独跑 59 全绿，与本次无关）。影响接口：无（纯前端交互增强，复用既有 getMetric/updateMetric）。"
    note_20260827_d: "SQL 批量编辑向导「口径与责任」布局修复 + 批量创建按钮反馈兜底（2026-08-27，semantic+frontend）：用户反馈「依赖指标过多且过长时展示不全/内容覆盖到计算表达式口径列、点批量创建没有任何反应」。① 布局——向导 Modal 加宽 940→1280，Step0/1 表格加横向滚动（scroll.x 960/1020，固定列宽不再相互挤压溢出）；「依赖指标」多选加 maxTagCount=responsive（过多/过长依赖折叠为 +N，不再撑破列宽覆盖相邻列）+ 列加宽（依赖 225→260、口径 180→230），口径 Input/Typography 加宽（220/210），口径列 ellipsis 截断 + Tooltip 全量展示；② 按钮反馈兜底——两个「批量创建选中指标」按钮移除 disabled（此前批量无原子候选时默认勾选为空、按钮禁用点击被浏览器静默忽略 = 用户感知『点击没反应』），未勾选时点击给明确 warning 提示 + 按钮下方常驻灰色引导文案「请先勾选候选指标（默认仅勾选原子候选，派生/复合需手动勾选）」；空勾选 warning 文案增强。验证：前端 MetricCreate 74（+1 向导步骤③点击批量创建选中指标正常触发 batch-register-from-sql 回归用例——此前该路径无测试覆盖）+ tsc 0。影响接口：无（纯前端布局与交互反馈增强）。"
    note_20260827_f: "SQL 智能推断行内投影注释回填候选名称（2026-08-27，semantic）：用户反馈「批量解析生成的指标名称不能把字段注释的描述回填进去」——`... as old_page_transfer_order_cnt -- 转诊预约旧页面` 被解析成「日订单量（old_page_transfer_order_cnt）」而非「转诊预约旧页面」。根因：此前仅消费建表 DDL 的 `comment '...'` 列注释（A-5），数仓开发在 SELECT 投影里写的行内 `-- 中文` 注释（最普遍写法）从未提取。修复：① `sql_infer._projection_comment` 从 sqlglot 投影节点（Alias/Column/AggFunc）的 `comments` 提取行尾注释（P0-B 裸聚合被 `alias_` 包裹时注释在内层 this）；② `_projection_measures` 全分支（位图/HLL、collect、条件聚合、coalesce 多聚合、普通聚合）与 `_collect_derived_measures`（A7 算术派生列 + 比率派生）的 measure 统一携带 `comment`；③ `_build_atomic_candidate` 行内注释注入 `measure_meta.comment`（优先于建表 DDL 注释——行内注释是当前 SQL 投影里写的字段语义更贴近口径；建表注释兜底，A-5 行为不变），`_infer_name`/`_infer_unit` 自动消费——「总订单数/会话侧栏/区域上级机构订单量/转诊预约旧页面」替代列名词表兜底「日订单量」，同列多 count 名称不再雷同（无需 C 去重后缀）、外层算术派生列名称从「日订单量（old_page_transfer_order_cnt）」变为「日转诊预约旧页面」。验证：test_sql_split 79（+2：用户场景端到端——内层聚合三注释回填 + 外层派生列注释回填 + 名称互异；裸聚合注释/无注释不污染）+ 相关 6 文件（sql_split/sql_infer/auto_fill/sql_batch_api/metrics_infer_api/sql_validation）245 passed + ruff 0。影响接口：无（候选 name 沿用既有字段，注释仅提升推断质量）。"
    note_20260827_g: "指标目录回收站彻底删除闭环 + 存量 PUBLISHED 残留清理（2026-08-27，semantic）：用户反馈「回收站里能看到已发布状态的指标」。根因：6 条 PUBLISHED + 1 条 DEPRECATED E2E 测试指标（sales_e2e_*/user_e2e_*，2026-08-24 06:20 软删）早于删除守卫（e4422c46，仅 DRAFT/DEPRECATED 可删）存在；软删只置 deleted_at 不改 status → 保持 PUBLISHED 进回收站，而 restore 仅允许 DRAFT → 卡死（不能恢复、无其他操作入口）。修复：① 后端新增 `POST /metric-definitions/{code}/purge`（仅平台管理员 require_roles(\"platform_admin\")、仅 deleted_at 置位记录、物理删除 + 级联清理 metric_version/metric_dimension/metric_health_score/metric_value_snapshot/metric_mount/lineage_edge 关联单事务；审计 metric_definition.purge；repository.purge_metric 8 类 delete、service.purge_metric 三层校验对齐 measure_catalog 先例）；② 前端回收站操作列加「彻底删除」按钮（Popconfirm 二次确认、仅平台管理员 currentUserRole===platform_admin 可见、外层 span 拦冒泡防 Table 行点击）；③ 存量清理——真实 DB 单事务物理删除 7 条 E2E 残留（血缘 27 边/版本 7/维度 2/健康度 7 级联清除），回收站余 19 条 DRAFT 可恢复记录、PUBLISHED/DEPRECATED 已删残留归零。验证：后端 test_metric_lifecycle_api 313→315（+2：service purge 成功/未删拒绝/非管理员拒绝/不存在 + API purge 200 角色传递）+ 相关 335 passed + ruff 0（仅既有 SIM102/B007）；前端 MetricCatalog 59（+1 彻底删除二次确认调用 purgeMetric，顺带补回收站 describe 缺失 mockedMeasures 默认值修复顺序依赖）+ tsc 0。影响接口：新增 `POST /metric-definitions/{code}/purge`（仅平台管理员）。"
    note_20260827_h: "统一主数据审批工作台（2026-08-27，dimension+glossary+semantic+frontend）：用户反馈「维度发起审批指定用户后在哪个入口审批」——此前维度/逻辑度量/术语被指派评审人无统一审批入口（散落各管理页状态筛选「审核中」行内按钮，通知无直达、列表无 reviewer 过滤，只有指标有 /metrics/review 工作台）。补齐：① 后端——dimension/measure_catalog/glossary 列表接口新增 `reviewed_by` 参数（「我审过的」过滤 approver_id==X OR reject_reviewer_id==X，与指标模块语义一致，repository/service/api 三层透传，缺省不过滤向后兼容）；policy.py 新增 `master-data:review` 权限点（domain_admin/reviewer 角色基线，platform_admin 走 registry.keys 自动获得，防悬空测试通过）；② 前端——新建 `MasterDataReview` 页（路由 /master-data/review + 菜单「主数据审批」+ ROUTE_PERM `master-data:review`）：Segmented「待我审/我审过的」；待我审 = 三模块 status=REVIEW 拉取（page_size 200）+ 前端 canReviewMasterData 只显示当前用户可审行（指定用户/域评审组/未指派域管理员兜底）；我审过的 = 三模块 reviewed_by=me 聚合展示通过/驳回处理结果（原因+时间）；行内通过/驳回复用共享 MasterDataReviewActions/MasterDataReviewModals（按类型分发 approveDimension/approveMeasureCatalog/approveTerm 等 api，驳回弹窗保留完整行以选对 api）；③ 通知——Notifications.tsx 补 dimension/measure/term.submitted 事件标签（维度待审核/逻辑度量待审核/术语待审核）+ 影响文案 + NEEDS_ACTION，actionFor 加「去审批」直达按钮跳 /master-data/review（补齐此前主数据通知无行动按钮的缺口）。验证：后端三模块 repository 测试 +6（reviewed_by 过滤 approver/rejector + 缺省不加条件）相关 159 passed + test_governance_policy 41（防悬空）+ ruff 0；前端 MasterDataReview 6（待我审只显示我可审/我审过的处理结果/通过按类型分发/驳回弹窗）/Notifications 52/Layout 10 + 前端全量 1054 passed + tsc 0。影响接口：三模块 GET /dimensions|/measure-catalogs|/terms 新增可选 reviewed_by；新增权限点 master-data:review。"
    note_20260827_i: "统一审批中心（2026-08-27，semantic+frontend）：用户反馈「把指标审批以及其他有关审批的工作流都整合到一起」（含冲突仲裁）。新建 /approval 页（ApprovalCenter）——antd Tabs 三 Tab 内嵌 MetricReview/MasterDataReview/ReviewWorkbench（三者均加 embedded prop 隐藏各自 page-head 防嵌套头部，功能零降级）；URL ?tab=metrics|master-data|conflict 深链同步；权限语义保留——tab 按 metric:review/master-data:review/review:view 过滤（无权 tab 隐藏、全无权限空态），菜单「审批中心」按 canAny 三权限点过滤（替换原「指标审批/主数据审批/冲突仲裁」三个入口）；原深链路由 /metrics/review、/master-data/review、/review 保留并重定向到对应 Tab（不破坏既有书签/通知/旧链接）；通知/待办跳转统一指向 /approval?tab=（actionFor metric→metrics、主数据→master-data、冲突→conflict；fieldTarget conflict_id、handleOpen conflict；TodoCenter conflict/review）。验证：前端 ApprovalCenter 3（三 Tab 默认激活指标审批/?tab=conflict 深链直达/切换挂载）+ Notifications 52 + TodoCenter + Layout + 前端全量 1058 passed（1 项 LineageView 既存 flaky 单独跑 48 全绿，与本次无关）+ tsc 0。影响接口：新增 /approval 路由；原三个深链路由语义不变（重定向兼容）。"
    note_20260827_l: "冲突处置闭环补齐（2026-08-27，semantic+conflict+frontend）：用户反馈「冲突仲裁对比报『指标不存在: outpatient_telemedicine_oldpagetransferordercnt_day』」+「冲突升级后没有后续处理流程」。① 悬空冲突处置——`delete_metric` 删除前检查未决冲突引用（ConflictRepository.count_open_for_metric，有则 400 CONFLICT_EXISTS 提示先处置，杜绝删除指标留下悬空冲突）；`_get_metric_for_compare` 对普通软删（无仲裁 successor）指标返回友好 METRIC_DELETED（携带 deleted_at，前端提示「建议强制关闭」）而非裸 404；conflict service 新增 force_close（OPEN/NEGOTIATING/ESCALATED → CLOSED，decision_json 留痕 force_closed + 关闭人，发布 conflict_forced_closed）+ API POST /conflicts/{id}/force-close（治理角色）；② 升级链路补全——sla_tasks 新增 remind_stale_escalated（每日 cron 6:05，扫描升级超 48h 未处置的 ESCALATED 冲突，定向通知其域 domain_admin + 全部 platform_admin，event=conflict_escalation_overdue，notify_user 不依赖订阅偏好）；conflict_forced_closed/conflict_escalation_overdue 注册订阅 + 标题映射；③ 前端——仲裁台加「升级队列」快捷筛选按钮 + ESCALATED 超时红标（updated_at 超 48h 显示「升级超时」Tag）+ 操作列「强制关闭」按钮（Popconfirm 二次确认）+ 对比 METRIC_DELETED 友好提示；Notifications 补两新事件标签；④ 存量清理——真实 DB 将 3 条悬空冲突（CF-29A5FFB47318/CF-40D5CEE19793/CF-9A11C3EF548A，引用已删候选 oldpagetransferordercnt_day）置 CLOSED + force_closed 留痕 + 清候选指标 pending_conflict。验证：后端 test_conflict_service +2（force_close 成功留痕/事件/清标记 + RULED 拒绝）+ test_conflict_sla +2（超时通知管理员 + 未超时跳过）+ test_semantic_service +1（普通软删 METRIC_DELETED）+ test_metric_lifecycle_api +1（CONFLICT_EXISTS 拦截）+ 相关 409 passed + ruff 0；前端 ReviewWorkbench 23（+3：强制关闭确认调用 forceCloseConflict / 升级超时红标 / METRIC_DELETED 友好提示）+ Notifications 52 + tsc 0。影响接口：新增 POST /conflicts/{id}/force-close；ConflictResponse 新增 updated_at；删除被未决冲突引用的指标返回 400 CONFLICT_EXISTS。"
    note_20260827_m: "主数据审批工作台加类型聚焦筛选（2026-08-27，frontend）：用户反馈「主数据审批里为什么把维度、术语审批混合在一起」（方案 1）。审批工作台在「待我审/我审过的」视角 Segmented 旁新增类型筛选 Segmented（全部/维度/逻辑度量/术语，默认「全部」保持聚合视图），纯前端过滤（filteredItems 按 kind 派生，切换即时响应不重新请求）；分页 total/空态文案随类型筛选联动（如「当前无待您评审的『维度』」）。验证：前端 MasterDataReview 7（+1：类型筛选切换维度/逻辑度量/术语/全部，Segmented 用 getByTitle 定位避免与表格 Tag 冲突；既有「类型标签齐全」断言改 getAllByText 兼容 Segmented 文本）+ tsc 0。影响接口：无（纯前端展示）。"
    note_20260828: "存量指标批量录入能力 + Swagger 前端入口（2026-08-28，semantic+frontend）：用户反馈「缺少类似 swagger ui 获取所有接口信息」+「外部 agent 批量解析 SQL 后如何自动录入大量存量指标」。A. Swagger 接入前端——nginx 新增 /docs /redoc /openapi.json 反代（覆盖全局 CSP 放行 jsdelivr/unpkg CDN 供 Swagger UI 加载；原 CSP script-src 'self' 会挡 CDN），系统管理菜单新增「API 文档」入口（新窗口打开 /docs，Authorize 填 token 在线调试）；B. 对外对接文档 docs/API_INTEGRATION.md——鉴权、批量录入端点、候选字段全表、4 段式编码规范、示例 payload（建表注释驱动命名）、CSV 模板列、错误码速查、对接顺序；C. 通用批量导入端点 `POST /metric-definitions/batch-import`——接受纯结构化候选（metric_code/name 可缺省，系统按 {域}_{源表末段去通用后缀}_{度量列}_{周期} 自动补全 4 段式编码、度量列中文化兜底名称），复用 batch_register_from_sql 的 savepoint 逐条隔离 + 域门禁 + 冲突预检，来源标注 agent/csv/manual，审计 metric_definition.batch_import(_failed/_partial)；D. CSV 模板导入——`GET /metric-definitions/imports/template`（带鉴权下载 CSV 模板）+ `POST /metric-definitions/imports/csv`（multipart 上传，Python csv 逐行解析 + 单行容错 row_errors 不阻断有效行 + 全行非法 400 INVALID_CSV），前端指标目录工具栏「批量导入」弹窗（模板下载 + 目标域选择 + 上传 + 逐条结果表格与解析错误回显）；依赖 python-multipart 加入 requirements.txt（FastAPI Form/File 必需）。验证：后端 test_metric_batch_api 24（+6：batch-import 自动补全编码/名称 + 显式保留 + csv 逐行解析创建 + 非法行 row_errors + 全行非法 400 + 模板下载）+ 指标相关 94 passed + ruff 0（仅 HEAD 既存 schemas E501）；前端 MetricCatalog+Layout 69 passed + tsc 0；前后端全量套件验证。影响接口：新增 POST /metric-definitions/batch-import、POST /metric-definitions/imports/csv、GET /metric-definitions/imports/template（均向后兼容新增）。"
    note_20260828_b: "消费指南/命名建议去模板化（2026-08-28，审查 🟡1/🟡2）：① 消费指南 auto 分支不再拼装模板「推荐用法」（适用 X 域 Y 粒度分析/聚合方式为 Z）——域/粒度/聚合已在基本信息卡展示，模板文案会伪装成人工推荐造成误导；recommended_usage 置空（前端显示「暂无推荐用法」+ 编辑入口），真实推导仅保留事实性注意（PII/不可加/半可加进 cautions）与血缘一跳关联推荐；② 仲裁改名建议删除无上下文的「原名·新口径」编造兜底——无度量列/域/对方名称时返回空列表；前端仅自动填入 source=llm 候选，rule 机械区分名只展示不自动污染输入框（此前第一个候选会被自动填入并可能被保存为正式名称）。验证：后端 test_semantic_service 消费指南 17 passed（+1 不可加事实注意）+ test_suggest_rename_api 4 passed（+1 无上下文返回空）+ ruff 0；前端 MetricDetail 87 passed（+1 rule 不自动填入）+ tsc 0。影响接口：无（GET 消费指南 auto 分支 recommended_usage 由模板文案变空数组，PUT 写路径不变；suggest-rename 无上下文时返回空列表）。"
