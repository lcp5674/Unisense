    note_20260817: "复审全量修复（P0-P2 + A-F 类）：① P0 安全（越权收紧/LLM额度/异常脱敏）；② P1 闭环（collector触发DSD+健康告警+紧急补审+灰度回收+双实现合并）；③ P2 体验一致性（发布语义/确认弹窗/术语绑定/质量维度/文档门禁/常量收敛）；④ 复审 B 类闭环断线（DSD通知+待办+血缘影响通知接线）、C 类健壮性（批量DB回滚+僵尸清理+血缘失败告警）、D 类体验（批量提交直达+详情删除入口+筛选控件）、E 类测试（8路由补测+E2E审批断言+P2前端断言）、F 类核验（sensitive_rules 部署风险消除）。验证：后端全量 2939 passed/0 failed（语义域 405 项），前端 vitest 753 全绿 + tsc 0；evidence 更新为 2026-08-17 报告。\n"
