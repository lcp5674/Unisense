cope 解析（限定列命中子查询表→内层、未限定列→内层优先外层回退、限定列不在内层即相关引用→外层），s.v 伪边消除、d.v 真实源补齐；② 命名窗口引用（ROW_NUMBER() OVER w）派生源全丢：PARTITION/ORDER 列定义在 Select 的 WINDOW w AS (...) 子句而非投影内，_resolve_projection 按名查窗口定义补解析派生源，且 _extract_branch_edges 不再因投影无内联列而提前跳过；③ UNPIVOT 输出列伪列：UNPIVOT (v FOR k IN (a,b,c)) u 的 u.v 此前归属不存在的 s.v（qualifier u 不在 sources，Pivot 挂在源表上），新增 _matching_unpivot/_unpivot_output_sources——值列归 In 列表源列（s.a/s.b/s.c 多源）、名列 k 是列名字面量不产数据边。验证：parser 95 项全绿（新增 4 项）+ lineage 205 项全绿 + ruff/format/mypy 0。第十四轮系统性穷举核查（2026-08-17）：不再逐轮抽查，改为五维穷举矩阵（语句×方言×结构×表达式×边界，9 方言 × 90+ 生产场景）真实验证 + coverage 代码路径分析（89%→93%）一次性核查——结论：历轮修复后 parser 已无功能性缺口（90+ 场景三层输出全部正确，含方言专属 Oracle INSERT ALL/tsql INSERT TOP/CK ARRAY JOIN/Doris AGGREGATE KEY、集合运算、CTE 同名遮蔽、PG LATERAL/UNNEST、Hive EXPLODE、UNPIVOT、命名窗口、标量子查询、多表 UPDATE、MERGE 多 WHEN 等；剩余未覆盖 7% 全部为防御/不可达降级分支）。产出：新增 test_lineage_matrix.py 穷举回归套件（101 项：99 矩阵场景精确断言 TE/FE 集合 + node 构造函数 + 星号投影 UD 跳过），固化历轮全部已修复行为，未来任何改动都会被矩阵立即捕获。验证：lineage 相关 306 项全绿（parser 95 + matrix 101 + repository/service）+ 全量 unit 2720 passed（7 失败全为并行会话collector 3 + 预存 semantic_cache 4，与本次零交集）+ ruff/format/mypy 0；第十五轮防御分支全覆盖（2026-08-17）：用 pytest coverage 逐行定位 parser.py 剩余未覆盖行，直接构造 AST / monkeypatch（scope 构建失败、异常兜底、30.x Whens 容器、UNPIVOT 无 Pivot、星号别名兜底等）补齐全部防御分支测试（test_lineage_defensive.py 增至 72 项）——覆盖率 96%→100%，parser.py 718 行全量覆盖，历轮修复与降级路径全部行为锁定。验证：lineage 相关 386 项全绿（parser 95 + matrix 101 + defensive 72 + repository/service）+ 全量 unit 无回归第十六轮企业级血缘平台落地（2026-08-17）：①血缘评测集（P0）——新增 backend/tests/eval/ golden dataset（24 个人工核对语义的真实生产场景，含线上 Hive 多表 JOIN+子查询 SQL），评测运行器输出精确率/召回率/准确率报告（CLI: python -m tests.eval.lineage_eval），回归断言 100% 精确匹配并负向验证有效（改坏期望即捕获并给出精确多余/缺失边诊断），把 parser 质量从「测试全绿」升级为「可度量准确率」；②批次解析/全量重建（P1）——新增 POST /lineage/parse-batch（LineageParseBatchRequest：statements 数组或 text 多语句文本块二选一、整批共用 dialect/target_table），逐条独立解析（单条失败不阻断）、成环边跳过计数、单事务幂等写入（added/updated/skipped 变更摘要 + 逐条明细）、写 kind=batch_parse 运行记录、同步图存储 + 失效两端影响缓存 + 发布 lineage_batch_parsed 事件；注入守卫豁免 statements/text 字段（与 /parse 的 sql 同语义：仅