    note_20260825: "数据源类型枚举补漏 hive_metastore（2026-08-25，修复 test-connection 422）：Hive Metastore 采集器 0ab2a32 引入时注册表/连接器/前端类型列表均已支持，但共享枚举 SourceTypeEnum 遗漏该值，导致所有用 SourceType 校验的请求（test-connection/databases/tables/create/update）对 hive_metastore 直接 422，且 DB source_type_enum（8 值）即使绕过校验也 Data truncated（MySQL 1265）。① enums.py SourceTypeEnum 新增 HIVE_METASTORE（9 值，模型列自动跟随）；② 迁移 0086（挂并行 0085_metric_template_onedata 后保线性链）source_type_enum 扩 9 值（对齐 0033，MySQL 分支可逆）；③ 防回归——schema 级（TestConnectionRequest/DataSourceCreate/Update）+ API 级（test-connection 不再 422）+ 修陈旧断言 test_eight→test_nine_connector_types_registered（0ab2a32 起既存失败）。验证：210 collector 测试全绿 + 全量 3298 passed（剩 audit_i18n/feature_flags 2 项既存非本次）+ ruff 0 + alembic 单 head + 真实 DB upgrade 到 0086 枚举含 hive_metastore + 容器重建后真实 API hive_metastore test-connection 200（SSRF 拦内网伪造 host，schema 已放行）。后续补记（2026-08-25）：① HMS database 缺省按 hive 填充（6de63f1）——schemas.py `_ensure_hms_database`（Create/Update/TestConnection 对 hive_metastore 缺 database 自动填 hive）+ hive_metastore.py 工厂 build_from_cfg 直接入口同默认，杜绝裸 1046；前端类型选 Hive Metastore 自动预填 database=hive 且标「HMS 元数据库名（必填）」；DEV_GUIDE §9a 新增数据源类型扩展全链路同步规范 + 关键连接凭据产品友好提示原则（1046 教训）；② 采集目录默认只显示活跃源（93c9666）——源状态筛选默认 active，删除数据源确认文案改诚实表述（软删除 + 采集目录追溯保留，可在「已删除源」筛选查看）。验证：collector 224 + DataSources 40 + 前端全量 861 全绿 + tsc 0 + ruff 0 + doc_sync 通过。③ 库名筛选下拉与列表源状态对齐（source_status 透传）——GET /catalogs/databases 新增 source_status query 参数（active/deleted/all，pattern 校验非法值 422），repository outerjoin DataSource 按源软删状态过滤（缺省不过滤向后兼容，与 _list_catalogs_with_source_status 语义一致），前端 listCatalogDatabases 透传 source_status、库名下拉随源状态联动（useEffect 依赖 sourceId+sourceStatus）——消除「列表默认只看活跃源但下拉混入已删源库名、选了库后列表为空」的不一致。验证：collector 215 + Catalogs 34 全绿 + ruff 0 + tsc 0。④ 治理面板可折叠 + 共享刷新 + 两块视角友好提示（方案 B+D）——治理面板（统计卡+按表列缺失字段数治理表格+批量推断区）包进 antd Collapse 可折叠（默认展开，收起给采集目录列表让位），Collapse 标题标注「描述缺失治理（治理视角…）」；DescriptionCoveragePanel 改 forwardRef 暴露 reload 句柄，主列表「刷新」按钮经 handleRefreshAll 同时刷新主列表与治理面板（去掉治理面板内重复刷新按钮，全页仅一个刷新入口）；主列表 Card 补 title「采集目录（运维视角