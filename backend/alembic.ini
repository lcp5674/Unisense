# Alembic 配置（对齐 DEV_GUIDE §9 数据库变更规范）

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =  # 从 env.py 注入（从 app.core.config.settings 读取）

[post_write_hooks]
hooks = ruff
ruff.type = console_exec
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
