# Unisense 后端依赖管理（对齐 DEV_GUIDE §18）
# 工具：Poetry（pyproject.toml + poetry.lock）
# 使用：poetry install（生产依赖）/ poetry install --with dev（含开发依赖）
# CI 中通过 `poetry export -f requirements.txt -o requirements.txt` 供 pip-audit 扫描

[project]
name = "unisense"
version = "0.1.0"
description = "Unisense 指标语义中台"
authors = [{ name = "Unisense Team" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    # Web 框架
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.30.0",
    # ORM
    "sqlalchemy~=2.0.0",
    "alembic~=1.13.0",
    "pymysql~=1.1.0",
    "aiomysql>=0.3.0,<0.4.0",  # 2026-08-10: 纳入 0.3.0 安全修复（PYSEC-2026-1110）
    # 数据验证
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    # Redis
    "redis~=5.0",
    # 采集异步队列（Arq，基于 Redis）
    "arq~=0.28.0",
    # Neo4j
    "neo4j~=5.0",
    # Elasticsearch
    "elasticsearch~=8.15.0",
    # 日志
    "structlog~=24.0",
    # 可观测性
    "opentelemetry-api~=1.27.0",
    "opentelemetry-sdk~=1.27.0",
    "opentelemetry-instrumentation-fastapi~=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy~=0.48b0",
    "opentelemetry-instrumentation-redis~=0.48b0",
    # SQL 解析（血缘）
    "sqlglot~=25.0",
    "sqlparse~=0.5.0",
    # 认证
    "pyjwt>=2.13.0,<3.0.0",  # 2026-08-10: 放开兼容发布上界以纳入 2.13.0 安全修复（PYSEC-2026-176/178）
    "bcrypt~=4.2.0",
    # MySQL 8 caching_sha2_password 认证所需（pymysql/aiomysql RSA 加密）
    "cryptography>=43.0",
    # HTTP 客户端
    "httpx~=0.27.0",
    # 通知邮件外发（SMTP）
    "aiosmtplib~=3.0.1",
    # 工具
    "python-dateutil~=2.9.0",
    "pyyaml~=6.0",
]

[tool.poetry]
packages = [{ include = "backend" }]

[tool.poetry.group.dev.dependencies]
# 测试
pytest = ">=8.0"
pytest-cov = ">=5.0"
pytest-mock = ">=3.0"
pytest-asyncio = ">=0.23"
testcontainers = ">=4.0"
# Lint / 类型
ruff = ">=0.6.0"
mypy = ">=1.11"
# 安全
pip-audit = ">=2.0"
# 预提交
pre-commit = ">=3.0"
# 性能测试
k6 = ">=0.1.0"

# ---- Ruff 配置（对齐 DEV_GUIDE §8a.2）----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
# B008: FastAPI 依赖注入标准写法（Depends(...) 作默认参数），属误报，按社区惯例忽略
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---- Black 配置（对齐 DEV_GUIDE §8a.2，ruff-format 替代 black，此处保留兼容）----
[tool.black]
line-length = 100
target-version = ["py311"]

# ---- Mypy 配置（对齐 DEV_GUIDE §2 门禁 mypy --strict）----
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# 测试由 pytest 覆盖，不纳入严格类型契约（避免 tests.conftest 双重模块名问题）
exclude = ["backend/tests"]

# ---- Pytest 配置 ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
    "slow: 耗时 >1s 的测试",
    "integration: 需要 testcontainers 的测试",
    "smoke: 冒烟测试（核心链路快速验证）",
]
addopts = "-ra --strict-markers"


# ---- 构建系统 ----
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---- 可选依赖组 ----
[tool.poetry.group.collectors]
optional = true

[tool.poetry.group.collectors.dependencies]
# PostgreSQL 异步驱动
asyncpg = ">=0.29.0"
# Kafka 客户端
confluent-kafka = ">=2.3.0"
# ClickHouse HTTP API 无需额外驱动（已由 httpx 覆盖）
# Hive beeline CLI 无需 Python 驱动（通过 subprocess 调用）
# Doris/StarRocks 使用 MySQL 协议兼容（已由 aiomysql 覆盖）
