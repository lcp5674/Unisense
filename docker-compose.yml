# Unisense 完整开发环境（依赖 + 后端 + 前端）
# 使用：docker compose up -d
# 停止：docker compose down
# 查看：docker compose ps
# 后端日志：docker compose logs -f backend
# 前端日志：docker compose logs -f frontend
#
# 访问地址：
#   前端：http://localhost:8080
#   后端 API 文档：http://localhost:8000/docs
#   后端健康检查：http://localhost:8000/health
#   Prometheus 指标：http://localhost:8000/metrics
#
# 端口避让说明（避免与本机已有 Docker 服务冲突）：
#   MySQL 偏移至 3307，ES 偏移至 19200，Redis 偏移至 16379
#   后端 8000，前端 8080

services:
  # ============ 基础设施（依赖服务）============
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${UNISENSE_MYSQL_ROOT_PASSWORD:-test}
      MYSQL_DATABASE: ${UNISENSE_MYSQL_DATABASE:-unisense}
      MYSQL_USER: ${UNISENSE_MYSQL_USER:-unisense}
      MYSQL_PASSWORD: ${UNISENSE_MYSQL_PASSWORD:-test}
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${UNISENSE_NEO4J_USER:-neo4j}/${UNISENSE_NEO4J_PASSWORD:-test1234}
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${UNISENSE_ES_PASSWORD:-es_changeme}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["19200:9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${UNISENSE_ES_PASSWORD:-es_changeme} http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- Elasticsearch security setup (create keystore + passwords) ----
  elasticsearch-setup:
    image: elasticsearch:8.15.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      bash -c '
        echo "Elasticsearch security already configured via ELASTIC_PASSWORD env var."
        echo "Built-in elastic user password: ${UNISENSE_ES_PASSWORD:-es_changeme}"
        echo "Setup complete."
      '

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Apache Doris (OLAP 执行引擎) ----
  doris-fe:
    image: apache/doris:2.0.3-fe-x86_64
    container_name: unisense-doris-fe
    ports: ["8030:8030", "9030:9030"]
    environment:
      FE_SERVERS: "fe1:127.0.0.1:9010"
      FE_ID: 1
    volumes:
      - doris_fe_data:/opt/apache-doris/fe/doris-meta
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8030/api/bootstrap || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  doris-be:
    image: apache/doris:2.0.3-be-x86_64
    container_name: unisense-doris-be
    ports: ["8040:8040"]
    environment:
      FE_SERVERS: "fe1:doris-fe:9010"
      BE_ADDR: "doris-be:9050"
    volumes:
      - doris_be_data:/opt/apache-doris/be/storage
    depends_on:
      doris-fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8040/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- MinIO (S3 兼容对象存储，用于审计归档) ----
  minio:
    image: minio/minio:latest
    container_name: unisense-minio
    # 宿主 19000/19001 → 容器 9000/9001（9000 已被 patent-exam-minio 占用）
    ports: ["19000:9000", "19001:9001"]
    environment:
      MINIO_ROOT_USER: ${UNISENSE_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${UNISENSE_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ 应用服务 ============
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: unisense-backend
    # 宿主 8100 → 容器 8000（8000 已被 patent-exam-backend 占用，做端口避让）
    ports: ["8100:8000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      UNISENSE_ENV: ${UNISENSE_ENV:-dev}
      # Docker 网络内用服务名 mysql，而非 localhost
      UNISENSE_DB_URL: mysql+pymysql://${UNISENSE_MYSQL_USER:-unisense}:${UNISENSE_MYSQL_PASSWORD:-test}@mysql:3306/${UNISENSE_MYSQL_DATABASE:-unisense}
      UNISENSE_REDIS_URL: redis://redis:6379/0
      UNISENSE_NEO4J_URL: bolt://neo4j:7687
      UNISENSE_NEO4J_USER: ${UNISENSE_NEO4J_USER:-neo4j}
      UNISENSE_NEO4J_PASSWORD: ${UNISENSE_NEO4J_PASSWORD:-test1234}
      UNISENSE_ES_URL: http://elasticsearch:9200
      UNISENSE_ES_USERNAME: elastic
      UNISENSE_ES_PASSWORD: ${UNISENSE_ES_PASSWORD:-es_changeme}
      # OLAP 可选，默认空（consume 查询会降级 503）
      UNISENSE_OLAP_URL: ${UNISENSE_OLAP_URL:-}
      # JWT 密钥（生产必须通过环境变量注入强密钥）
      UNISENSE_JWT_SECRET: ${UNISENSE_JWT_SECRET:-dev-jwt-secret-change-in-production-32bytes}
      UNISENSE_JWT_ALGORITHM: HS256
      UNISENSE_JWT_EXPIRE_MINUTES: 60
      # CORS：前端容器访问（宿主 8180 → nginx 80）
      UNISENSE_CORS_ORIGINS: http://localhost:8180,http://frontend:80
      UNISENSE_LOG_LEVEL: INFO
      UNISENSE_LOG_FORMAT: json
      # LLM 配置（OpenAI 协议兼容）
      UNISENSE_LLM_BASE_URL: ${UNISENSE_LLM_BASE_URL:-}
      UNISENSE_LLM_API_KEY: ${UNISENSE_LLM_API_KEY:-}
      UNISENSE_LLM_DEFAULT_MODEL: ${UNISENSE_LLM_DEFAULT_MODEL:-deepseek-chat}
      # 通知 webhook（可选）
      UNISENSE_NOTIFY_WEBHOOK_URL: ${UNISENSE_NOTIFY_WEBHOOK_URL:-}
      # Fernet 密钥（生产必须注入独立密钥）
      UNISENSE_FERNET_KEY: ${UNISENSE_FERNET_KEY:-}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if
          urllib.request.urlopen('http://localhost:8000/health',timeout=3).status
          == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 构建时 API 基础地址留空，运行时通过 nginx 反代 /api 到 backend
        VITE_API_BASE_URL: ""
        VITE_SEMANTIC_API_KEY: ${VITE_SEMANTIC_API_KEY:-dev-semantic-key}
    container_name: unisense-frontend
    # 宿主 8180 → nginx 80（8080 已被 multica-backend-1 占用，做端口避让）
    ports: ["8180:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # 覆盖 Dockerfile 的健康检查：用显式 IPv4（localhost 在 nginx 容器内可能解析到 ::1）
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mysql_data:
  neo4j_data:
  es_data:
  redis_data:
  doris_fe_data:
  doris_be_data:
  minio_data:
