# Unisense 完整开发环境（依赖 + 后端 + 前端）
# 使用：docker compose up -d
# 停止：docker compose down
# 查看：docker compose ps
# 后端日志：docker compose logs -f backend
# 前端日志：docker compose logs -f frontend
#
# 访问地址（宿主端口，2026-08-28 修正注释与实际映射一致）：
#   前端：http://localhost:8180
#   后端 API 文档：http://localhost:8100/docs
#   后端健康检查：http://localhost:8100/health
#   Prometheus 指标：http://localhost:8100/metrics
#
# 端口避让说明（避免与本机已有 Docker 服务冲突）：
#   MySQL 偏移至 3307，ES 偏移至 19200，Redis 偏移至 16379
#   后端 8100（容器 8000），前端 8180（容器 8080）

services:
  # ============ 基础设施（依赖服务）============
  # ---- MySQL binlog 独立卷权限初始化（一次性，幂等）----
  # mysql:8.0 官方镜像 entrypoint 只 chown 数据目录 /var/lib/mysql，不处理自定义挂载点；
  # unisense_binlog 命名卷首次创建为 root:root，mysql 用户(uid=999)无写权限 → 全新卷启动
  # 失败（errno 13 Permission denied）。此 init 容器在 mysql 启动前 chown 该卷，
  # 完成后 mysql 才启动（depends_on service_completed_successfully）；chown 幂等，
  # 后续每次 up 无副作用（卷权限已正确时立即退出）。
  mysql-init:
    image: mysql:8.0
    container_name: unisense-mysql-init
    entrypoint: ["chown", "-R", "999:999", "/var/lib/mysql-binlog"]
    volumes:
      - unisense_binlog:/var/lib/mysql-binlog
    restart: "no"

  mysql:
    image: mysql:8.0
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${UNISENSE_MYSQL_ROOT_PASSWORD:-test}
      MYSQL_DATABASE: ${UNISENSE_MYSQL_DATABASE:-unisense}
      MYSQL_USER: ${UNISENSE_MYSQL_USER:-unisense}
      MYSQL_PASSWORD: ${UNISENSE_MYSQL_PASSWORD:-test}
    ports: ["3307:3306"]
    # 资源限制（8核/32G 单机生产基线；可经 .env 覆盖）
    mem_limit: ${UNISENSE_MYSQL_MEM:-5g}
    cpus: ${UNISENSE_MYSQL_CPUS:-2}
    volumes:
      - mysql_data:/var/lib/mysql
      - unisense_binlog:/var/lib/mysql-binlog
    # 开启 binlog（ROW 格式）供增量备份（RPO ≤ 15min）；binlog 独立卷供 backup 服务只读归档
    # log-bin-trust-function-creators=1：迁移会以业务账号建触发器/函数（WORM 审计等），
    # binlog 开启时非 SUPER 账号需此变量，否则 alembic 迁移 1419 失败（全新卷必现）
    command: >-
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --innodb-buffer-pool-size=${UNISENSE_MYSQL_BUFFER_POOL:-4G}
      --innodb-flush-log-at-trx-commit=2
      --max-connections=200
      --server-id=1
      --log-bin=/var/lib/mysql-binlog/binlog
      --binlog-format=ROW
      --binlog_expire_logs_seconds=604800
      --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${UNISENSE_NEO4J_USER:-neo4j}/${UNISENSE_NEO4J_PASSWORD:-test1234}
      NEO4J_server_memory_heap_max__size: ${UNISENSE_NEO4J_HEAP:-1536m}
    ports: ["7474:7474", "7687:7687"]
    mem_limit: ${UNISENSE_NEO4J_MEM:-2g}
    cpus: ${UNISENSE_NEO4J_CPUS:-1}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${UNISENSE_ES_PASSWORD:-es_changeme}
      # 审查修复：512MB 堆过低（ES 最小可用配置），升到 2G；8核/32G 基线
      - "ES_JAVA_OPTS=-Xms${UNISENSE_ES_HEAP:-2g} -Xmx${UNISENSE_ES_HEAP:-2g}"
    ports: ["19200:9200"]
    mem_limit: ${UNISENSE_ES_MEM:-4g}
    cpus: ${UNISENSE_ES_CPUS:-1.5}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${UNISENSE_ES_PASSWORD:-es_changeme} http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- Elasticsearch ----
  # 索引创建与数据同步由 backend 启动链的 scripts/bootstrap.py（best-effort）自动完成，
  # 不再需要独立 setup 服务。

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    mem_limit: ${UNISENSE_REDIS_MEM:-1g}
    cpus: ${UNISENSE_REDIS_CPUS:-0.5}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Apache Doris (OLAP 执行引擎) ----
  # 2026-08-28（审查部署项）：内部生产暂不考虑 Doris——consume 查询走 MySQL 降级引擎
  # （degraded=true 正常返回），且已有外部 Doris 可经 UNISENSE_OLAP_URL 配置接入。
  # 需要时取消注释并 `docker compose up -d doris-fe doris-be` 即可启用（8核/32G 建议 3G+4G）。
  # doris-fe:
  #   image: apache/doris:2.0.3-fe-x86_64
  #   container_name: unisense-doris-fe
  #   ports: ["8030:8030", "9030:9030"]
  #   environment:
  #     FE_SERVERS: "fe1:127.0.0.1:9010"
  #     FE_ID: 1
  #   volumes:
  #     - doris_fe_data:/opt/apache-doris/fe/doris-meta
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:8030/api/bootstrap || exit 1"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

  # doris-be:
  #   image: apache/doris:2.0.3-be-x86_64
  #   container_name: unisense-doris-be
  #   ports: ["8040:8040"]
  #   environment:
  #     FE_SERVERS: "fe1:doris-fe:9010"
  #     BE_ADDR: "doris-be:9050"
  #   volumes:
  #     - doris_be_data:/opt/apache-doris/be/storage
  #   depends_on:
  #     doris-fe:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:8040/api/health || exit 1"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

  # ---- MinIO (S3 兼容对象存储，用于审计归档) ----
  minio:
    # S-2（第九轮）：minio:latest 是最危险的浮动 tag——发布前在可联网机器执行
    # scripts/pin_base_images.sh --apply 固定 digest（消除拉取漂移/供应链风险）。
    image: minio/minio:latest
    container_name: unisense-minio
    # 宿主 19000/19001 → 容器 9000/9001（9000 已被 patent-exam-minio 占用）
    ports: ["19000:9000", "19001:9001"]
    mem_limit: ${UNISENSE_MINIO_MEM:-0.5g}
    cpus: ${UNISENSE_MINIO_CPUS:-0.25}
    environment:
      MINIO_ROOT_USER: ${UNISENSE_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${UNISENSE_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ 应用服务 ============
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Python 包镜像源：默认清华源（国内构建快）；需切换时在 .env 设
        # PIP_INDEX_URL 覆盖（如公司内网源）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    # S-3（第九轮）：发布/回滚载体——设 UNISENSE_IMAGE_TAG=<发布版本> 时
    # 直接拉取已推送镜像（回滚 = 换 tag），否则本地构建（dev）。
    image: unisense/backend:${UNISENSE_IMAGE_TAG:-dev}
    container_name: unisense-backend
    # 宿主 8100 → 容器 8000（8000 已被 patent-exam-backend 占用，做端口避让）
    ports: ["8100:8000"]
    mem_limit: ${UNISENSE_BACKEND_MEM:-5g}
    cpus: ${UNISENSE_BACKEND_CPUS:-2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # 自举会在启动期创建/同步 ES 索引；缺此依赖时 ES 未就绪会导致该步失败
      # （best-effort 不阻断启动，但首日检索为空），故纳入启动前就绪依赖。
      elasticsearch:
        condition: service_healthy
    environment:
      UNISENSE_ENV: ${UNISENSE_ENV:-dev}
      # ---- 部署自举（scripts/bootstrap.py，随容器启动自动完成，无需人工介入）----
      # true=启用；UNISENSE_BOOTSTRAP_STEPS 可裁剪步骤
      # （逗号分隔：admin,domains,reference,es,neo4j）
      # reference=维度/术语/业务主题域首次初始化：受 seed_marker 持久标记约束，
      # 仅首次部署自动灌入；迭代重建容器检测到标记即跳过（不重灌，不覆盖业务修改）。
      UNISENSE_BOOTSTRAP_ENABLED: ${UNISENSE_BOOTSTRAP_ENABLED:-true}
      UNISENSE_BOOTSTRAP_STEPS: ${UNISENSE_BOOTSTRAP_STEPS:-admin,domains,reference,es,neo4j}
      UNISENSE_BOOTSTRAP_ES_SYNC: ${UNISENSE_BOOTSTRAP_ES_SYNC:-true}
      UNISENSE_BOOTSTRAP_NEO4J_SYNC: ${UNISENSE_BOOTSTRAP_NEO4J_SYNC:-true}
      # 单步软超时（秒）：Neo4j 全量对账在超大图上可能超时 → 该步标记 failed 但不
      # 阻断启动，由每日 02:30 定时对账任务兜底；超大图可设 NEO4J_SYNC=false 跳过首启同步。
      UNISENSE_BOOTSTRAP_TIMEOUT: ${UNISENSE_BOOTSTRAP_TIMEOUT:-120}
      UNISENSE_BOOTSTRAP_LOCK_WAIT: ${UNISENSE_BOOTSTRAP_LOCK_WAIT:-20}
      UNISENSE_BOOTSTRAP_ES_SYNC_MAX_DOCS: ${UNISENSE_BOOTSTRAP_ES_SYNC_MAX_DOCS:-50000}
      # 管理员初始密码（生产必须注入强口令；留空则用默认弱口令并打印告警）
      UNISENSE_SEED_ADMIN_PASSWORD: ${UNISENSE_SEED_ADMIN_PASSWORD:-}
      # Docker 网络内用服务名 mysql，而非 localhost
      UNISENSE_DB_URL: mysql+pymysql://${UNISENSE_MYSQL_USER:-unisense}:${UNISENSE_MYSQL_PASSWORD:-test}@mysql:3306/${UNISENSE_MYSQL_DATABASE:-unisense}
      UNISENSE_REDIS_URL: redis://redis:6379/0
      UNISENSE_NEO4J_URL: bolt://neo4j:7687
      UNISENSE_NEO4J_USER: ${UNISENSE_NEO4J_USER:-neo4j}
      UNISENSE_NEO4J_PASSWORD: ${UNISENSE_NEO4J_PASSWORD:-test1234}
      UNISENSE_ES_URL: http://elasticsearch:9200
      UNISENSE_ES_USERNAME: elastic
      UNISENSE_ES_PASSWORD: ${UNISENSE_ES_PASSWORD:-es_changeme}
      # OLAP 可选，默认空（consume 查询会降级 503）
      UNISENSE_OLAP_URL: ${UNISENSE_OLAP_URL:-}
      # Doris/StarRocks 直连地址（OLAPExecutor 实际连接参数；未显式配置时由
      # config._derive_doris_from_olap_url 从 UNISENSE_OLAP_URL 自动派生 host/port）
      UNISENSE_DORIS_HOST: ${UNISENSE_DORIS_HOST:-}
      UNISENSE_DORIS_PORT: ${UNISENSE_DORIS_PORT:-8030}
      UNISENSE_DORIS_DATABASE: ${UNISENSE_DORIS_DATABASE:-unisense}
      # MinIO（S3 兼容对象存储，审计归档）——此前 compose 定义了 minio 服务但
      # backend/worker 未注入 UNISENSE_MINIO_*，容器内默认 localhost:9000 空凭据
      # → audit_archive 上传必败（第六轮 P2-4）
      UNISENSE_MINIO_ENDPOINT: ${UNISENSE_MINIO_ENDPOINT:-minio:9000}
      UNISENSE_MINIO_ACCESS_KEY: ${UNISENSE_MINIO_ACCESS_KEY:-minioadmin}
      UNISENSE_MINIO_SECRET_KEY: ${UNISENSE_MINIO_SECRET_KEY:-minioadmin}
      UNISENSE_MINIO_BUCKET: ${UNISENSE_MINIO_BUCKET:-unisense-archive}
      # 采集预检（测试连接/枚举库/列表）SSRF 放行私有网段开关——内网部署设 true
      UNISENSE_COLLECTOR_ALLOW_PRIVATE: ${UNISENSE_COLLECTOR_ALLOW_PRIVATE:-false}
      # MySQL 查询降级引擎（OLAP 不可用时的只读兜底，指向可执行指标口径的 MySQL 业务库）
      UNISENSE_MYSQL_FALLBACK_URL: ${UNISENSE_MYSQL_FALLBACK_URL:-mysql+aiomysql://e2e:e2e@mysql:3306/e2e_biz?charset=utf8mb4}
      # JWT 密钥（生产必须通过环境变量注入强密钥）
      UNISENSE_JWT_SECRET: ${UNISENSE_JWT_SECRET:-dev-jwt-secret-change-in-production-32bytes}
      UNISENSE_JWT_ALGORITHM: HS256
      UNISENSE_JWT_EXPIRE_MINUTES: 60
      # CORS：前端容器访问（宿主 8180 → nginx 80）
      UNISENSE_CORS_ORIGINS: http://localhost:8180,http://frontend:80
      UNISENSE_LOG_LEVEL: INFO
      UNISENSE_LOG_FORMAT: json
      # LLM 配置（OpenAI 协议兼容）
      UNISENSE_LLM_BASE_URL: ${UNISENSE_LLM_BASE_URL:-}
      UNISENSE_LLM_API_KEY: ${UNISENSE_LLM_API_KEY:-}
      UNISENSE_LLM_DEFAULT_MODEL: ${UNISENSE_LLM_DEFAULT_MODEL:-deepseek-chat}
      # 通知 webhook（可选）
      UNISENSE_NOTIFY_WEBHOOK_URL: ${UNISENSE_NOTIFY_WEBHOOK_URL:-}
      # Fernet 密钥（生产必须注入独立密钥）
      UNISENSE_FERNET_KEY: ${UNISENSE_FERNET_KEY:-}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if
          urllib.request.urlopen('http://localhost:8000/ready',timeout=5).status
          == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      # 自举（admin/主题域 + ES 索引同步）在 uvicorn 之前执行，拉长启动宽限期
      start_period: 90s

  # ============ 采集异步 worker（P0-7：定时调度真实执行者）============
  # 消费后端投递的采集任务 + 每分钟扫描 schedule_cron 触发定时采集
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 与 backend 同镜像，透传同一 Python 包镜像源（默认清华源）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    # 与 backend 同一镜像（worker 复用 backend 镜像，tag 跟随发布版本）
    image: unisense/backend:${UNISENSE_IMAGE_TAG:-dev}
    container_name: unisense-worker
    # 采集峰值主力（8核/32G 基线 6G/3核；可经 .env 覆盖）
    mem_limit: ${UNISENSE_WORKER_MEM:-6g}
    cpus: ${UNISENSE_WORKER_CPUS:-3}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      UNISENSE_ENV: ${UNISENSE_ENV:-dev}
      UNISENSE_DB_URL: mysql+pymysql://${UNISENSE_MYSQL_USER:-unisense}:${UNISENSE_MYSQL_PASSWORD:-test}@mysql:3306/${UNISENSE_MYSQL_DATABASE:-unisense}
      UNISENSE_REDIS_URL: redis://redis:6379/0
      UNISENSE_NEO4J_URL: bolt://neo4j:7687
      UNISENSE_NEO4J_USER: ${UNISENSE_NEO4J_USER:-neo4j}
      UNISENSE_NEO4J_PASSWORD: ${UNISENSE_NEO4J_PASSWORD:-test1234}
      UNISENSE_ES_URL: http://elasticsearch:9200
      UNISENSE_ES_USERNAME: elastic
      UNISENSE_ES_PASSWORD: ${UNISENSE_ES_PASSWORD:-es_changeme}
      UNISENSE_OLAP_URL: ${UNISENSE_OLAP_URL:-}
      UNISENSE_DORIS_HOST: ${UNISENSE_DORIS_HOST:-}
      UNISENSE_DORIS_PORT: ${UNISENSE_DORIS_PORT:-8030}
      UNISENSE_DORIS_DATABASE: ${UNISENSE_DORIS_DATABASE:-unisense}
      # MinIO（S3 兼容对象存储，审计归档）——此前 compose 定义了 minio 服务但
      # backend/worker 未注入 UNISENSE_MINIO_*，容器内默认 localhost:9000 空凭据
      # → audit_archive 上传必败（第六轮 P2-4）
      UNISENSE_MINIO_ENDPOINT: ${UNISENSE_MINIO_ENDPOINT:-minio:9000}
      UNISENSE_MINIO_ACCESS_KEY: ${UNISENSE_MINIO_ACCESS_KEY:-minioadmin}
      UNISENSE_MINIO_SECRET_KEY: ${UNISENSE_MINIO_SECRET_KEY:-minioadmin}
      UNISENSE_MINIO_BUCKET: ${UNISENSE_MINIO_BUCKET:-unisense-archive}
      # 采集预检 SSRF 放行私有网段开关（worker 与 backend 同配置）
      UNISENSE_COLLECTOR_ALLOW_PRIVATE: ${UNISENSE_COLLECTOR_ALLOW_PRIVATE:-false}
      # worker 与 backend 同镜像，须同步注入 JWT_SECRET（否则 Settings 校验必填失败）
      UNISENSE_JWT_SECRET: ${UNISENSE_JWT_SECRET:-dev-jwt-secret-change-in-production-32bytes}
      UNISENSE_JWT_ALGORITHM: HS256
      UNISENSE_JWT_EXPIRE_MINUTES: 60
      UNISENSE_CORS_ORIGINS: http://localhost:8180,http://frontend:80
      UNISENSE_LOG_LEVEL: INFO
      UNISENSE_LOG_FORMAT: json
      UNISENSE_LLM_BASE_URL: ${UNISENSE_LLM_BASE_URL:-}
      UNISENSE_LLM_API_KEY: ${UNISENSE_LLM_API_KEY:-}
      UNISENSE_LLM_DEFAULT_MODEL: ${UNISENSE_LLM_DEFAULT_MODEL:-deepseek-chat}
      UNISENSE_NOTIFY_WEBHOOK_URL: ${UNISENSE_NOTIFY_WEBHOOK_URL:-}
      UNISENSE_FERNET_KEY: ${UNISENSE_FERNET_KEY:-}
    # arq worker 不监听 HTTP，覆盖镜像级 :8000 健康检查，改为检测 arq 进程存活
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import os,sys;sys.exit(0 if any('arq app.services.collector.worker' in open('/proc/%s/cmdline'%p,'rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit()) else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["sh", "-c", "arq app.services.collector.worker.WorkerSettings"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 构建时 API 基础地址留空，运行时通过 nginx 反代 /api 到 backend
        VITE_API_BASE_URL: ""
        VITE_SEMANTIC_API_KEY: ${VITE_SEMANTIC_API_KEY:-dev-semantic-key}
    # S-3：发布/回滚载体（与 backend 同 tag 策略）
    image: unisense/frontend:${UNISENSE_IMAGE_TAG:-dev}
    container_name: unisense-frontend
    # nginx 官方形态 = master root + worker 降权；pid 写 /dev/null（见 frontend/Dockerfile
    # 注释）——绕开 CentOS 7 老内核(3.10)+Docker 26 下 pid 文件写 EPERM 崩溃问题。
    # 曾试过 compose user: "0"/tmpfs 覆盖与 pid 改 /var/run，均无法规避，最终 pid 置 /dev/null。
    # 宿主 8180 → 容器 8080（nginx 降权后监听非特权端口 8080；宿主端口保持 8180 不变）
    ports: ["8180:8080"]
    mem_limit: ${UNISENSE_FRONTEND_MEM:-0.5g}
    cpus: ${UNISENSE_FRONTEND_CPUS:-0.25}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # 覆盖 Dockerfile 的健康检查：用显式 IPv4（localhost 在 nginx 容器内可能解析到 ::1）
    # 注意：nginx 降权后监听 8080（见 frontend/Dockerfile），健康检查必须打 8080 而非 80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ============ 数据备份（每日自动，7 天轮转，RPO ≤ 1 天）============
  # 基于 mysql:8.0 镜像（自带 mysqldump），通过网络备份 MySQL 到挂载卷。
  # 手动触发：docker compose run --rm backup
  backup:
    image: mysql:8.0
    container_name: unisense-backup
    mem_limit: ${UNISENSE_BACKUP_MEM:-0.5g}
    cpus: ${UNISENSE_BACKUP_CPUS:-0.25}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${UNISENSE_MYSQL_USER:-unisense}
      MYSQL_PASSWORD: ${UNISENSE_MYSQL_PASSWORD:-test}
      MYSQL_DATABASE: ${UNISENSE_MYSQL_DATABASE:-unisense}
      # P1-2（第八轮）：多库备份（空格分隔）——含 e2e_biz 降级业务库；
      # backup.sh 未设置 MYSQL_DATABASES 时回退 MYSQL_DATABASE 单库。
      MYSQL_DATABASES: ${UNISENSE_BACKUP_DATABASES:-unisense}
      BACKUP_DIR: /backups
      RETENTION_DAYS: "7"
      # S15（审查修复）：备份加密密钥（生产必须设置 ≥16 字符，AES-256 加密落盘）
      BACKUP_ENCRYPTION_KEY: ${UNISENSE_BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - ./backend/scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - unisense_backups:/backups
    entrypoint:
      - sh
      - -c
      - >-
        while true; do
          if sh /usr/local/bin/backup.sh; then
            echo "[backup-svc] ok, sleep 24h";
            sleep 86400;
          else
            echo "[backup-svc] FAILED: 备份失败，60s 后重试（不再静默吞掉）" >&2;
            sleep 60;
          fi;
        done
    restart: unless-stopped

  # ============ binlog 增量备份（每 5 分钟，RPO ≤ 15min）============
  # 只读挂载 mysql 的 binlog 独立卷，FLUSH LOGS 后归档新文件到备份卷。
  # 与每日全量 backup 服务配合：恢复 = 最新全量 + 全量之后的所有 binlog。
  binlog-backup:
    image: mysql:8.0
    container_name: unisense-binlog-backup
    mem_limit: ${UNISENSE_BINLOG_MEM:-0.5g}
    cpus: ${UNISENSE_BINLOG_CPUS:-0.25}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${UNISENSE_MYSQL_USER:-unisense}
      MYSQL_PASSWORD: ${UNISENSE_MYSQL_PASSWORD:-test}
      BINLOG_SRC: /mysql-binlog
      BINLOG_DIR: /backups/binlog
      RETENTION_DAYS: "7"
    volumes:
      - ./backend/scripts/backup_binlog.sh:/usr/local/bin/backup_binlog.sh:ro
      - unisense_binlog:/mysql-binlog:ro
      - unisense_backups:/backups
    entrypoint:
      - sh
      - -c
      - >-
        while true; do
          sh /usr/local/bin/backup_binlog.sh;
          echo "[binlog-svc] sleep 5m";
          sleep 300;
        done
    restart: unless-stopped

  # ============ 参照数据 seed（一次性初始化，profiles: seed）============
  # 维度管理 / 术语 / 主题域 / 数据字典的基础数据自动初始化：
  #   docker compose --profile seed run --rm seed-reference
  # 依次执行两个 seed（重复执行安全，0 新增）：
  #   1. scripts.seed_domains_dicts     —— 标准主题域 + 12 类 system_dict 基础字典
  #      （backend bootstrap 的 domains 步骤启动时已自动执行；此处兜底其关闭场景）
  #   2. scripts.seed_medical_reference —— 业务主题域(119) + 术语(127) + 维度(52)
  #      bootstrap 的 reference 步骤首次部署已自动执行（seed_marker 只初始化一次）；
  #      本服务主要作为**手动强制重灌**入口：默认已初始化则跳过；
  #      需覆盖业务修改重灌时：docker compose --profile seed run --rm \
  #        -e UNISENSE_SEED_REFERENCE_FORCE=1 seed-reference
  # 镜像复用 unisense/backend（scripts 已随 COPY backend/ 入镜像），依赖 mysql healthy。
  seed-reference:
    image: unisense/backend:${UNISENSE_IMAGE_TAG:-dev}
    profiles: ["seed"]
    mem_limit: ${UNISENSE_SEED_MEM:-1g}
    cpus: ${UNISENSE_SEED_CPUS:-0.5}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      UNISENSE_ENV: ${UNISENSE_ENV:-dev}
      UNISENSE_DB_URL: mysql+pymysql://${UNISENSE_MYSQL_USER:-unisense}:${UNISENSE_MYSQL_PASSWORD:-test}@mysql:3306/${UNISENSE_MYSQL_DATABASE:-unisense}
      UNISENSE_REDIS_URL: redis://redis:6379/0
      UNISENSE_NEO4J_URL: bolt://neo4j:7687
      UNISENSE_NEO4J_USER: ${UNISENSE_NEO4J_USER:-neo4j}
      UNISENSE_NEO4J_PASSWORD: ${UNISENSE_NEO4J_PASSWORD:-test1234}
      UNISENSE_ES_URL: http://elasticsearch:9200
      UNISENSE_ES_USERNAME: elastic
      UNISENSE_ES_PASSWORD: ${UNISENSE_ES_PASSWORD:-es_changeme}
      UNISENSE_OLAP_URL: ${UNISENSE_OLAP_URL:-}
      # 与 backend 同镜像，须同步注入 JWT_SECRET（否则 Settings 校验必填失败）
      UNISENSE_JWT_SECRET: ${UNISENSE_JWT_SECRET:-dev-jwt-secret-change-in-production-32bytes}
      UNISENSE_JWT_ALGORITHM: HS256
      UNISENSE_JWT_EXPIRE_MINUTES: 60
      UNISENSE_CORS_ORIGINS: http://localhost:8180,http://frontend:80
      UNISENSE_LOG_LEVEL: INFO
      UNISENSE_LOG_FORMAT: json
      UNISENSE_LLM_BASE_URL: ${UNISENSE_LLM_BASE_URL:-}
      UNISENSE_LLM_API_KEY: ${UNISENSE_LLM_API_KEY:-}
      UNISENSE_LLM_DEFAULT_MODEL: ${UNISENSE_LLM_DEFAULT_MODEL:-deepseek-chat}
      UNISENSE_NOTIFY_WEBHOOK_URL: ${UNISENSE_NOTIFY_WEBHOOK_URL:-}
      UNISENSE_FERNET_KEY: ${UNISENSE_FERNET_KEY:-}
      # 参照数据强制重灌开关：1/true = 无视 seed_marker 强制重灌（覆盖业务修改前慎用）
      UNISENSE_SEED_REFERENCE_FORCE: ${UNISENSE_SEED_REFERENCE_FORCE:-}
    # 顺序执行两个幂等 seed：标准域/字典 → 业务主题域/术语/维度
    command:
      - sh
      - -c
      - >-
        python -m scripts.seed_domains_dicts &&
        python -m scripts.seed_medical_reference
    restart: "no"

volumes:
  mysql_data:
  unisense_binlog:
  neo4j_data:
  es_data:
  redis_data:
  minio_data:
  unisense_backups:
